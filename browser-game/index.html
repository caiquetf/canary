<html lang="pt-BR">

<title>Tibia Android</title>
<style>
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{width:100%;height:100%;background:#0a0500;overflow:hidden;font-family:'Courier New',monospace;touch-action:none;user-select:none}
#charSelect{position:fixed;inset:0;background:radial-gradient(ellipse at center,#2d1a0a 0%,#0a0500 100%);display:flex;flex-direction:column;align-items:center;justify-content:center;color:#E8D5B7;z-index:100;padding:20px}

.cs-section{width:100%;max-width:500px;margin-bottom:16px}
.cs-label{color:#FFD700;font-size:13px;margin-bottom:6px;text-transform:uppercase;letter-spacing:1px}
.cs-input{width:100%;background:#1a0e05;border:2px solid #8B6914;color:#FFD700;padding:10px 14px;font-size:18px;font-family:inherit;outline:none;border-radius:4px}
.cs-input:focus{border-color:#FFD700}
.voc-grid{display:grid;grid-template-columns:1fr 1fr;gap:8px;width:100%;max-width:500px}
.voc-btn{background:#1a0e05;border:2px solid #5C3317;color:#E8D5B7;padding:12px;cursor:pointer;border-radius:4px;text-align:left;transition:all .2s}
.voc-btn:hover,.voc-btn.sel{border-color:#FFD700;background:#2d1a0a;color:#FFD700}
.voc-btn .vname{font-size:16px;font-weight:bold;margin-bottom:4px}
.voc-btn .vdesc{font-size:11px;color:#8B8B8B}
.voc-btn.sel .vdesc{color:#C8A860}
#startBtn{background:#8B6914;border:none;color:#000;padding:14px 40px;font-size:20px;font-family:inherit;font-weight:bold;cursor:pointer;border-radius:4px;margin-top:8px;letter-spacing:2px;transition:background .2s;width:100%;max-width:500px}
#startBtn:hover{background:#FFD700}
#gameWrap{display:none;width:100vw;height:100vh;position:relative}
#gameCanvas{display:block;position:absolute;top:0;left:0}
#dpad{position:absolute;pointer-events:all}
.dp{background:rgba(40,20,0,.75);border:2px solid #7A4A1A;border-radius:8px;display:flex;align-items:center;justify-content:center;color:#E8C060;cursor:pointer;-webkit-user-select:none;font-weight:bold}
.dp:active,.dp.active{background:rgba(139,105,20,.9);color:#FFD700;border-color:#FFD700}
#actionBtns{position:absolute;display:flex;gap:6px;pointer-events:all}
.abtn{background:rgba(40,20,0,.8);border:2px solid #7A4A1A;border-radius:8px;color:#E8D5B7;font-family:inherit;cursor:pointer;display:flex;flex-direction:column;align-items:center;justify-content:center;font-weight:bold;line-height:1.2;-webkit-user-select:none}
.abtn:active{background:rgba(139,105,20,.9);color:#FFD700}

#spellBar::-webkit-scrollbar{display:none}
.sbtn{background:rgba(15,8,0,.9);border:2px solid #7A4A1A;border-radius:6px;color:#E8D5B7;font-family:inherit;cursor:pointer;display:flex;flex-direction:column;align-items:center;justify-content:center;line-height:1.1;-webkit-user-select:none;position:relative;overflow:hidden;flex-shrink:0;padding:0}

.sbtn.locked{opacity:.32}

// ═══ A* PATHFINDING ═══
function aStar(passable, sx, sy, gx, gy, maxSteps=200) {
  if (sx===gx && sy===gy) return [];
  if (!passable(gx,gy)) {
    let found=false;
    outer: for(let r=1;r<4;r++) for(let dy=-r;dy<=r;dy++) for(let dx=-r;dx<=r;dx++) {
      if(passable(gx+dx,gy+dy)){gx+=dx;gy+=dy;found=true;break outer;}
    }
    if(!found) return [];
  }
  const open=[],g={},from={};
  const key=(x,y)=>x*1000+y;
  const heur=(x,y)=>Math.abs(x-gx)+Math.abs(y-gy);
  open.push([heur(sx,sy),sx,sy]);
  g[key(sx,sy)]=0;
  while(open.length && Object.keys(g).length<maxSteps){
    open.sort((a,b)=>a[0]-b[0]);
    const[,cx,cy]=open.shift();
    if(cx===gx&&cy===gy){
      const path=[];let cur=key(gx,gy);
      while(from[cur]){const[px,py]=from[cur];path.unshift([px,py]);cur=key(px,py);}
      path.push([gx,gy]);return path.slice(1);
    }
    for(const[dx,dy] of [[-1,0],[1,0],[0,-1],[0,1]]){
      const nx=cx+dx,ny=cy+dy;
      if(!passable(nx,ny)) continue;
      const ng=(g[key(cx,cy)]||0)+1;
      if(ng<(g[key(nx,ny)]??999999)){
        g[key(nx,ny)]=ng;from[key(nx,ny)]=[cx,cy];
        open.push([ng+heur(nx,ny),nx,ny]);
      }
    }
  }
  return [];
}

// ═══ MAP ═══
class WorldMap {
  constructor(){
    this.data=Array.from({length:MAP_H},()=>Array(MAP_W).fill('G'));
    this._gen();
  }
  get(x,y){if(x<0||y<0||x>=MAP_W||y>=MAP_H)return 'M';return this.data[y][x];}
  set(x,y,t){if(x>0&&y>0&&x<MAP_W-1&&y<MAP_H-1)this.data[y][x]=t;}
  passable(x,y){return TILE_DEF[this.get(x,y)]?.[2]??false;}
  _gen(){
    const r=(a,b)=>Math.floor(Math.random()*(b-a))+a;
    for(let x=0;x<MAP_W;x++){this.set(x,0,'M');this.set(x,MAP_H-1,'M');}
    for(let y=0;y<MAP_H;y++){this.set(0,y,'M');this.set(MAP_W-1,y,'M');}
    let rx=r(MAP_W/4,3*MAP_W/4);
    for(let y=1;y<MAP_H-1;y++){
      for(let dx=-2;dx<=2;dx++)this.set(rx+dx,y,'W');
      rx+=r(-1,2);rx=Math.max(5,Math.min(MAP_W-6,rx));
    }
    for(let i=0;i<18;i++){
      let cx=r(10,MAP_W-10),cy=r(10,MAP_H-10),rad=r(4,12);
      for(let dy=-rad;dy<=rad;dy++)for(let dx=-rad;dx<=rad;dx++)
        if(dx*dx+dy*dy<=rad*rad&&Math.random()<.65&&this.get(cx+dx,cy+dy)==='G')
          this.set(cx+dx,cy+dy,'T');
    }
    for(let i=0;i<5;i++){
      let cx=r(20,MAP_W-20),cy=r(20,MAP_H-20);
      for(let s=0;s<r(8,22);s++){
        for(let dy=-3;dy<=3;dy++)for(let dx=-3;dx<=3;dx++)
          if(Math.random()<.55)this.set(cx+dx,cy+dy,'M');
        cx+=r(-2,3);cy+=r(-2,3);
      }
    }
    this._town(30,30);this._town(90,30);this._town(60,90);
    this._dungeon(60,60);this._dungeon(35,85);
  }
  _town(cx,cy){
    const s=10,r=(a,b)=>Math.floor(Math.random()*(b-a))+a;
    for(let dy=-s;dy<=s;dy++)for(let dx=-s;dx<=s;dx++)this.set(cx+dx,cy+dy,'S');
    for(let dx=-(s+1);dx<=s+1;dx++){this.set(cx+dx,cy-s-1,'X');this.set(cx+dx,cy+s+1,'X');}
    for(let dy=-(s+1);dy<=s+1;dy++){this.set(cx-s-1,cy+dy,'X');this.set(cx+s+1,cy+dy,'X');}
    for(let d=-1;d<=1;d++){
      this.set(cx+d,cy-s-1,'D');this.set(cx+d,cy+s+1,'D');
      this.set(cx-s-1,cy+d,'D');this.set(cx+s+1,cy+d,'D');
    }
    for(let i=0;i<5;i++){
      let bx=cx+r(-s+3,s-3),by=cy+r(-s+3,s-3),bw=r(3,6),bh=r(3,5);
      for(let dy=0;dy<=bh;dy++)for(let dx=0;dx<=bw;dx++)
        this.set(bx+dx,by+dy,(dx===0||dy===0||dx===bw||dy===bh)?'X':'S');
      this.set(bx+Math.floor(bw/2),by+bh,'S');
    }
  }
  _dungeon(cx,cy){
    const s=16,r=(a,b)=>Math.floor(Math.random()*(b-a))+a;
    for(let dy=-s;dy<=s;dy++)for(let dx=-s;dx<=s;dx++)this.set(cx+dx,cy+dy,'F');
    for(let i=0;i<7;i++){
      let rx=cx+r(-s+4,s-4),ry=cy+r(-s+4,s-4),rw=r(4,9),rh=r(3,7);
      for(let dy=0;dy<=rh;dy++)for(let dx=0;dx<=rw;dx++)
        if(dx===0||dy===0||dx===rw||dy===rh)this.set(rx+dx,ry+dy,'V');
      this.set(rx+Math.floor(rw/2),ry+rh,'F');
    }
  }
}

// ═══ ENTITIES ═══
let _eid=0;
class Entity {
  constructor(x,y,name,maxHp,maxMp,atk,def,spd){
    this.id=++_eid;this.x=x;this.y=y;this.name=name;
    this.maxHp=maxHp;this.hp=maxHp;
    this.maxMp=maxMp||0;this.mp=this.maxMp;
    this.atk=atk||10;this.def=def||5;this.spd=spd||4;
    this.alive=true;this.moveCd=0;this.atkCd=0;
    this.flashTick=0;
  }
  damage(dmg){
    const mit=Math.max(1,dmg-Math.floor(this.def/2));
    this.hp=Math.max(0,this.hp-mit);
    this.flashTick=8;
    if(this.hp===0)this.alive=false;
    return mit;
  }
  heal(v){this.hp=Math.min(this.maxHp,this.hp+v);}
  restoreMp(v){this.mp=Math.min(this.maxMp,this.mp+v);}
}

class Player extends Entity {
  constructor(x,y,name,voc){
    const v=VOCATIONS[voc];
    super(x,y,name,150,50,15,10,4);
    this.voc=voc;this.vocData=v;
    this.level=1;this.xp=0;this.gold=200;
    this.inv={};this.eq={weapon:null,armor:null,helmet:null,shield:null};
    this.spellCds={};       // id -> ticks remaining
    this.atkBuff={val:1,ttl:0}; // multiplier + duration
    [1,8,11].forEach(id=>{this.addItem(id);this.equip(id);});
    for(let i=0;i<5;i++)this.addItem(20);
    for(let i=0;i<3;i++)this.addItem(22);
  }
  get totalAtk(){return Math.floor((this.atk+(this.eq.weapon?ITEMS[this.eq.weapon].atk:0))*this.atkBuff.val);}
  get totalDef(){return this.def+['armor','shield','helmet'].reduce((s,sl)=>s+(this.eq[sl]?ITEMS[this.eq[sl]].def:0),0);}
  get xpNext(){return this.level*this.level*100;}
  addItem(id,n=1){
    const it=ITEMS[id];if(!it)return;
    if(it.t==='gold'){this.gold+=n*it.val;return;}
    this.inv[id]=(this.inv[id]||0)+n;
  }
  removeItem(id,n=1){
    if((this.inv[id]||0)<n)return false;
    this.inv[id]-=n;if(this.inv[id]===0)delete this.inv[id];return true;
  }
  equip(id){
    const it=ITEMS[id];if(!it||this.level<it.lvl)return false;
    const slot=it.t;if(!(slot in this.eq))return false;
    this.eq[slot]=id;return true;
  }
  usePotion(id){
    const it=ITEMS[id];if(!it||it.t!=='potion')return false;
    if(!this.removeItem(id))return false;
    if(it.hp)this.heal(it.hp);
    if(it.mp)this.restoreMp(it.mp);
    return true;
  }
  gainXp(v){
    this.xp+=v;let leveled=false;
    while(this.xp>=this.xpNext){
      this.xp-=this.xpNext;this.level++;
      const v=this.vocData;
      this.maxHp+=v.hp;this.maxMp+=v.mp;this.atk+=v.atk;this.def+=v.def;
      this.hp=this.maxHp;this.mp=this.maxMp;leveled=true;
    }
    return leveled;
  }
}

class Monster extends Entity {
  constructor(x,y,idx){
    const[name,color,hp,atk,def,spd,xp,aggro,loot,minLvl]=MONSTERS[idx];
    super(x,y,name,hp,0,atk,def,spd);
    this.color=color;this.xpReward=xp;this.aggroRange=aggro;
    this.lootTable=loot;this.minLevel=minLvl;
    this.spawnX=x;this.spawnY=y;
    this.path=[];this.pathAge=0;
    this.wanderCd=Math.floor(Math.random()*20);
    this.monIdx=idx;
  }
  dropLoot(){return this.lootTable.filter(([,c])=>Math.random()<c).map(([id])=>id);}
}

// ═══ WORLD ═══
class World {
  constructor(player){
    this.player=player;
    this.map=new WorldMap();
    this.monsters=[];
    this.chat=[];
    this.floats=[];
    this.events=[];  // {t, x, y} for particle effects
    this.projectiles=[]; // visual only: {sx,sy,tx,ty,progress,speed,color}
    this.tick=0;
    this.regenTick=0;
    this.spawnedZones=new Set();
    player.x=30;player.y=30;
    this._fixPos(player);
    this._spawnZone(player.x,player.y,8,20);
    this.log('Bem-vindo! Mova com o D-pad. Toque em monstros para atacar.','#FFD700');
  }
  _fixPos(e){
    if(!this.map.passable(e.x,e.y))
      for(let r=1;r<10;r++)for(let dy=-r;dy<=r;dy++)for(let dx=-r;dx<=r;dx++)
        if(this.map.passable(e.x+dx,e.y+dy)){e.x+=dx;e.y+=dy;return;}
  }
  log(msg,color='#FFFFFF'){
    this.chat.push({msg,color,ts:Date.now()});
    if(this.chat.length>60)this.chat.shift();
  }
  float(text,x,y,color){
    this.floats.push({text,x,y:y*TILE,color,ttl:55,dy:-0.9});
  }
  update(){
    this.tick++;this.regenTick++;
    const p=this.player;
    const zk=`${Math.floor(p.x/20)}_${Math.floor(p.y/20)}`;
    if(!this.spawnedZones.has(zk)){this.spawnedZones.add(zk);this._spawnZone(p.x,p.y,8,22);}
    const dead=this.monsters.filter(m=>!m.alive);
    dead.forEach(m=>{
      const drops=m.dropLoot();
      drops.forEach(id=>p.addItem(id));
      if(drops.length)this.log(`${m.name} largou: ${drops.map(id=>ITEMS[id]?.n||'?').join(', ')}`,'#FFD700');
      const leveled=p.gainXp(m.xpReward);
      this.log(`+${m.xpReward} XP de ${m.name}.`,'#00CC00');
      if(leveled)this.log(`>>> LEVEL UP! Você é nível ${p.level}! <<<`,'#FFD700');
    });
    this.monsters=this.monsters.filter(m=>m.alive);
    this._updateAI();
    if(this.regenTick>=90){
      this.regenTick=0;
      p.restoreMp(Math.max(1,Math.floor(p.maxMp/20)));
      const near=this.monsters.some(m=>Math.max(Math.abs(m.x-p.x),Math.abs(m.y-p.y))<=4);
      if(!near)p.heal(Math.max(1,Math.floor(p.maxHp/30)));
    }
    this.floats.forEach(f=>{f.ttl--;f.y+=f.dy;});
    this.floats=this.floats.filter(f=>f.ttl>0);
    this.monsters.forEach(m=>{if(m.flashTick>0)m.flashTick--;});
    if(p.flashTick>0)p.flashTick--;
    // Spell cooldowns & buff
    for(const id in p.spellCds) if(p.spellCds[id]>0) p.spellCds[id]--;
    if(p.atkBuff.ttl>0){p.atkBuff.ttl--;if(p.atkBuff.ttl===0)p.atkBuff.val=1;}
    // Projectiles
    this.projectiles.forEach(pr=>{pr.progress+=pr.speed;});
    this.projectiles=this.projectiles.filter(pr=>pr.progress<1);
  }
  _updateAI(){
    const p=this.player;
    const passable=(x,y)=>this.map.passable(x,y)&&!this.monsters.some(m=>m.x===x&&m.y===y&&m.alive);
    for(const m of this.monsters){
      m.moveCd=Math.max(0,m.moveCd-1);m.atkCd=Math.max(0,m.atkCd-1);
      const dist=Math.max(Math.abs(m.x-p.x),Math.abs(m.y-p.y));
      if(dist<=m.aggroRange){
        if(dist<=1&&m.atkCd===0){
          m.atkCd=Math.max(1,10-Math.floor(m.spd/2));
          const dmg=Math.max(1,m.atk+Math.floor(Math.random()*7)-3);
          const actual=p.damage(dmg);
          this.float(`-${actual}`,p.x,p.y,'#FF4444');
          this.events.push({t:'blood',x:p.x,y:p.y});
          if(!p.alive)this.log('Você foi morto!','#FF0000');
        } else if(dist>1&&m.moveCd===0){
          m.moveCd=Math.max(1,8-Math.floor(m.spd/2));
          this._moveToward(m,p.x,p.y,passable);
        }
      } else {
        m.wanderCd--;
        if(m.wanderCd<=0&&m.moveCd===0){
          m.wanderCd=10+Math.floor(Math.random()*20);
          m.moveCd=Math.max(1,8-Math.floor(m.spd/2));
          const dirs=[[-1,0],[1,0],[0,-1],[0,1]];
          const[dx,dy]=dirs[Math.floor(Math.random()*4)];
          const nx=m.x+dx,ny=m.y+dy;
          if(this.map.passable(nx,ny)&&Math.max(Math.abs(nx-m.spawnX),Math.abs(ny-m.spawnY))<=8)
            [m.x,m.y]=[nx,ny];
        }
      }
    }
  }
  _moveToward(m,tx,ty,passable){
    m.pathAge++;
    if(m.pathAge>5||m.path.length===0){
      m.path=aStar(this.map.passable.bind(this.map),m.x,m.y,tx,ty);
      m.pathAge=0;
    }
    if(m.path.length){
      const[nx,ny]=m.path[0];
      if(passable(nx,ny)){m.x=nx;m.y=ny;m.path.shift();}
      else m.path=[];
    }
  }
  attackNearest(){
    const p=this.player;
    const adj=this.monsters.filter(m=>m.alive&&Math.max(Math.abs(m.x-p.x),Math.abs(m.y-p.y))<=1);
    if(!adj.length){this.log('Nenhum inimigo adjacente!','#AAAAAA');return;}
    this._playerHit(adj.reduce((a,b)=>a.hp<b.hp?a:b));
  }
  attackMonster(m){
    if(!m||!m.alive)return;
    const dist=Math.max(Math.abs(m.x-this.player.x),Math.abs(m.y-this.player.y));
    if(dist>1){this.log(`Chegue perto de ${m.name} para atacar!`,'#FF8800');return;}
    this._playerHit(m);
  }
  _playerHit(target){
    const p=this.player;
    if(Math.random()<.05){this.log('Você errou!','#888888');return;}
    const crit=Math.random()<.10;
    const base=p.totalAtk+Math.floor(Math.random()*7)-3;
    const dmg=crit?base*2:base;
    const actual=target.damage(dmg);
    this.log(`${crit?'CRÍTICO! ':''}Você causa ${actual} em ${target.name}.`,crit?'#FFD700':'#FFFFFF');
    this.float(`-${actual}`,target.x,target.y,crit?'#FFD700':'#FF4444');
    this.events.push({t:crit?'crit':'blood',x:target.x,y:target.y});
    if(!target.alive)this.log(`Você matou ${target.name}!`,'#00FF00');
  }
  useHpPotion(){
    const p=this.player;
    for(const id of[21,20]){
      if(p.inv[id]){const old=p.hp;p.usePotion(id);this.log(`Você usa ${ITEMS[id].n} e recupera ${p.hp-old} HP.`,'#CC0000');return;}
    }
    this.log('Sem poções de HP!','#FF0000');
  }
  useMpPotion(){
    const p=this.player;
    for(const id of[23,22]){
      if(p.inv[id]){const old=p.mp;p.usePotion(id);this.log(`Você usa ${ITEMS[id].n} e recupera ${p.mp-old} MP.`,'#0044CC');return;}
    }
    this.log('Sem poções de MP!','#0000FF');
  }
  castSpell(idx){
    const p=this.player; if(!p.alive) return;
    const avail=(SPELLS[p.voc]||[]).filter(s=>p.level>=s.lvl);
    const spell=avail[idx]; if(!spell) return;
    if((p.spellCds[spell.id]||0)>0){
      this.log(`${spell.name} em recarga (${p.spellCds[spell.id]} ticks)!`,'#888888'); return;
    }
    if(p.mp<spell.mp){this.log(`MP insuficiente para ${spell.name}!`,'#4444FF'); return;}
    p.mp-=spell.mp;
    p.spellCds[spell.id]=spell.cd;
    switch(spell.t){
      case 'melee':       this._sMelee(spell);      break;
      case 'area_melee':  this._sAreaMelee(spell);  break;
      case 'ranged':      this._sRanged(spell);     break;
      case 'area_ranged': this._sAreaRanged(spell); break;
      case 'line':        this._sLine(spell);       break;
      case 'heal':        this._sHeal(spell);       break;
      case 'buff':        this._sBuff(spell);       break;
      case 'all_ranged':  this._sAllRanged(spell);  break;
    }
  }
  _nearestIn(range){
    const p=this.player;
    return this.monsters
      .filter(m=>m.alive&&Math.max(Math.abs(m.x-p.x),Math.abs(m.y-p.y))<=range)
      .sort((a,b)=>Math.max(Math.abs(a.x-p.x),Math.abs(a.y-p.y))-Math.max(Math.abs(b.x-p.x),Math.abs(b.y-p.y)))[0]||null;
  }
  _spellDmg(target,spell){
    const p=this.player;
    const base=Math.floor(p.totalAtk*spell.val);
    const actual=target.damage(base);
    this.float(`-${actual}`,target.x,target.y,spell.color);
    this.events.push({t:'crit',x:target.x,y:target.y});
    if(!target.alive)this.log(`Você matou ${target.name}!`,'#00FF00');
    return actual;
  }
  _addProj(tx,ty,spell){
    const p=this.player;
    this.projectiles.push({sx:p.x,sy:p.y,tx,ty,progress:0,speed:0.18,color:spell.color});
  }
  _sMelee(spell){
    const t=this._nearestIn(1);
    if(!t){this.log('Nenhum inimigo adjacente!','#888');return;}
    const actual=this._spellDmg(t,spell);
    this.log(`${spell.name}: ${actual} de dano em ${t.name}!`,spell.color);
  }
  _sAreaMelee(spell){
    const p=this.player;
    const targets=this.monsters.filter(m=>m.alive&&Math.max(Math.abs(m.x-p.x),Math.abs(m.y-p.y))<=spell.range);
    if(!targets.length){this.log('Nenhum inimigo no alcance!','#888');return;}
    let total=0; targets.forEach(t=>{total+=this._spellDmg(t,spell);});
    this.log(`${spell.name}: ${total} de dano total em ${targets.length} inimigo(s)!`,spell.color);
  }
  _sRanged(spell){
    const t=this._nearestIn(spell.range);
    if(!t){this.log(`Nenhum inimigo em alcance ${spell.range}!`,'#888');return;}
    this._addProj(t.x,t.y,spell);
    const actual=this._spellDmg(t,spell);
    this.log(`${spell.name}: ${actual} de dano em ${t.name}!`,spell.color);
  }
  _sAreaRanged(spell){
    const center=this._nearestIn(spell.range);
    if(!center){this.log(`Nenhum inimigo em alcance ${spell.range}!`,'#888');return;}
    this._addProj(center.x,center.y,spell);
    const ar=spell.areaR||1;
    const targets=this.monsters.filter(m=>m.alive&&Math.max(Math.abs(m.x-center.x),Math.abs(m.y-center.y))<=ar);
    let total=0; targets.forEach(t=>{total+=this._spellDmg(t,spell);});
    this.log(`${spell.name}: ${total} de dano em ${targets.length} inimigo(s)!`,spell.color);
  }
  _sLine(spell){
    const p=this.player;
    const t=this._nearestIn(spell.range);
    if(!t){this.log('Nenhum inimigo no alcance!','#888');return;}
    this._addProj(t.x,t.y,spell);
    const dx=Math.sign(t.x-p.x), dy=Math.sign(t.y-p.y);
    const targets=this.monsters.filter(m=>{
      if(!m.alive) return false;
      const ex=m.x-p.x, ey=m.y-p.y;
      if(Math.max(Math.abs(ex),Math.abs(ey))>spell.range) return false;
      return (ex*dx+ey*dy)>0 && Math.abs(ex*dy-ey*dx)<=1;
    });
    let total=0; targets.forEach(t2=>{total+=this._spellDmg(t2,spell);});
    this.log(`${spell.name}: ${total} de dano em ${targets.length} inimigo(s)!`,spell.color);
  }
  _sHeal(spell){
    const old=this.player.hp;
    this.player.heal(spell.val);
    const got=this.player.hp-old;
    this.float(`+${got}`,this.player.x,this.player.y,spell.color);
    this.events.push({t:'heal',x:this.player.x,y:this.player.y,color:spell.color});
    this.log(`${spell.name}: recuperou ${got} HP!`,spell.color);
  }
  _sBuff(spell){
    this.player.atkBuff={val:spell.val,ttl:spell.dur};
    this.events.push({t:'crit',x:this.player.x,y:this.player.y});
    this.log(`${spell.name}: ATK ×${spell.val} por ${(spell.dur/30).toFixed(0)}s!`,spell.color);
  }
  _sAllRanged(spell){
    const p=this.player;
    const targets=this.monsters.filter(m=>m.alive&&Math.max(Math.abs(m.x-p.x),Math.abs(m.y-p.y))<=spell.range);
    if(!targets.length){this.log('Nenhum inimigo visível!','#888');return;}
    targets.forEach(t=>{this._addProj(t.x,t.y,spell);this._spellDmg(t,spell);});
    this.log(`${spell.name}: atingiu ${targets.length} inimigo(s)!`,spell.color);
  }
  _spawnZone(cx,cy,minD,maxD){
    const distO=Math.max(Math.abs(cx-30),Math.abs(cy-30));
    const maxLvl=Math.max(1,Math.floor(distO/8)+2);
    const elig=MONSTERS.map((_,i)=>i).filter(i=>MONSTERS[i][9]<=maxLvl);
    if(!elig.length)return;
    const count=3+Math.floor(Math.random()*5);
    for(let i=0;i<count;i++){
      const angle=Math.random()*Math.PI*2;
      const dist=minD+Math.floor(Math.random()*(maxD-minD));
      const mx=Math.round(cx+dist*Math.cos(angle));
      const my=Math.round(cy+dist*Math.sin(angle));
      if(this.map.passable(mx,my))
        this.monsters.push(new Monster(mx,my,elig[Math.floor(Math.random()*elig.length)]));
    }
  }
}

// ═══════════════════════════════════════════════════════
//  SPRITE CACHE — pre-renders all sprites with pixel-art black outlines
// ═══════════════════════════════════════════════════════
class SpriteCache {
  constructor() { this.s = {}; }

  build() {
    for (const [voc, data] of Object.entries(VOCATIONS)) {
      const raw = this._makeCanvas(32, 32);
      this._drawPlayer(raw.getContext('2d'), voc, data.color);
      this.s[`p_${voc}`]    = this._outline(raw);
      this.s[`p_${voc}_f`]  = this._whiteFlash(this.s[`p_${voc}`]);
    }
    MONSTERS.forEach(([,,,,,,,,,,], idx) => {
      const [name, color] = MONSTERS[idx];
      const raw = this._makeCanvas(32, 32);
      this._drawMonster(raw.getContext('2d'), idx, color);
      this.s[`m_${idx}`]   = this._outline(raw);
      this.s[`m_${idx}_f`] = this._whiteFlash(this.s[`m_${idx}`]);
    });
  }

  get(key) { return this.s[key]; }

  _makeCanvas(w, h) {
    const c = document.createElement('canvas');
    c.width = w; c.height = h; return c;
  }

  _outline(src) {
    const W = src.width, H = src.height;
    const px = src.getContext('2d').getImageData(0, 0, W, H).data;
    const OW = W + 2, OH = H + 2;
    const out = this._makeCanvas(OW, OH);
    const oc = out.getContext('2d');
    const img = oc.createImageData(OW, OH);
    const d = img.data;

    // Copy source pixels shifted by (1,1)
    for (let y = 0; y < H; y++) {
      for (let x = 0; x < W; x++) {
        const si = (y * W + x) * 4;
        if (px[si + 3] > 20) {
          const di = ((y + 1) * OW + (x + 1)) * 4;
          d[di] = px[si]; d[di+1] = px[si+1]; d[di+2] = px[si+2]; d[di+3] = px[si+3];
        }
      }
    }

    // Snapshot before outline pass
    const snap = new Uint8ClampedArray(d);
    for (let y = 0; y < OH; y++) {
      for (let x = 0; x < OW; x++) {
        const si = (y * OW + x) * 4;
        if (snap[si + 3] <= 20) continue;
        for (let dy = -1; dy <= 1; dy++) {
          for (let dx = -1; dx <= 1; dx++) {
            if (dx === 0 && dy === 0) continue;
            const nx = x + dx, ny = y + dy;
            if (nx < 0 || ny < 0 || nx >= OW || ny >= OH) continue;
            const ni = (ny * OW + nx) * 4;
            if (snap[ni + 3] < 20) {
              d[ni] = 0; d[ni+1] = 0; d[ni+2] = 0; d[ni+3] = 255;
            }
          }
        }
      }
    }
    oc.putImageData(img, 0, 0);
    return out;
  }

  _whiteFlash(src) {
    const out = this._makeCanvas(src.width, src.height);
    const ctx = out.getContext('2d');
    ctx.drawImage(src, 0, 0);
    ctx.globalCompositeOperation = 'source-in';
    ctx.fillStyle = '#FFFFFF';
    ctx.fillRect(0, 0, src.width, src.height);
    return out;
  }

  // ── color helpers ──
  _hex(h) {
    const n = parseInt(h.replace('#',''), 16);
    return [(n>>16)&255, (n>>8)&255, n&255];
  }
  _rgb(r,g,b) {
    return `#${Math.min(255,Math.max(0,r)).toString(16).padStart(2,'0')}${Math.min(255,Math.max(0,g)).toString(16).padStart(2,'0')}${Math.min(255,Math.max(0,b)).toString(16).padStart(2,'0')}`;
  }
  _lt(hex, a) { const[r,g,b]=this._hex(hex); return this._rgb(r+a,g+a,b+a); }
  _dk(hex, a) { const[r,g,b]=this._hex(hex); return this._rgb(r-a,g-a,b-a); }

  _drawPlayer(c, voc, color) {
    const T=32;
    // Shadow (not in sprite, drawn separately)

    // Boots
    c.fillStyle='#2A1A0A';
    c.fillRect(9,26,5,6);   // left boot
    c.fillRect(18,26,5,6);  // right boot
    c.fillStyle='#3E2010';
    c.fillRect(10,28,4,4);  // boot toe left
    c.fillRect(19,28,4,4);  // boot toe right

    // Greaves
    c.fillStyle=this._dk(color,30);
    c.fillRect(10,19,5,8);
    c.fillRect(17,19,5,8);
    c.fillStyle=this._lt(color,10);
    c.fillRect(11,20,2,5);  // shin highlight

    // Body armor
    c.fillStyle=color;
    c.fillRect(8,11,16,9);
    // Armor highlights
    c.fillStyle=this._lt(color,45);
    c.fillRect(9,12,7,3);
    // Armor shadow
    c.fillStyle=this._dk(color,35);
    c.fillRect(8,18,16,2);
    // Center chest line
    c.fillStyle=this._dk(color,50);
    c.fillRect(15,12,2,7);

    // Shoulder plates
    c.fillStyle=this._lt(color,20);
    c.fillRect(6,10,5,4);

    c.fillRect(6,27,7,4);c.fillRect(19,27,7,4);
    // Legs
    c.fillStyle=col;
    c.fillRect(6,16,7,12);c.fillRect(19,16,7,12);
    c.fillStyle=this._dk(col,30);
    c.fillRect(6,17,3,10);c.fillRect(23,17,3,10);
    // Wings (large and dark)
    c.fillStyle='#330000';
    c.fillRect(0,4,7,16);c.fillRect(25,4,7,16);
    c.fillStyle='#550000';
    c.fillRect(1,6,5,10);c.fillRect(26,6,5,10);
    c.fillStyle='#772222';
    c.fillRect(2,8,3,6);c.fillRect(27,8,3,6);
    // Body

    c.fillStyle=this._lt(col,20);
    c.fillRect(7,8,10,4);
    c.fillStyle=this._dk(col,30);

    // Arms
    c.fillStyle=col;
    c.fillRect(1,8,5,11);c.fillRect(26,8,5,11);
    // Claws

    // Curved horns
    c.fillStyle='#FFAA00';
    c.fillRect(7,0,4,6);c.fillRect(5,0,4,2);    // left horn
    c.fillRect(21,0,4,6);c.fillRect(23,0,4,2);  // right horn
    c.fillStyle='#CC8800';
    c.fillRect(7,3,2,2);c.fillRect(22,3,2,2);
    // Glowing eyes

    c.fillRect(10,2,5,4);c.fillRect(17,2,5,4);
    c.fillStyle='#FF9900';
    c.fillRect(11,3,3,2);c.fillRect(18,3,3,2);
    c.fillStyle='#FFFF00';
    c.fillRect(12,3,1,1);c.fillRect(19,3,1,1);
    // Fangs
    c.fillStyle='#111';c.fillRect(11,7,10,2);
    c.fillStyle='#FFF';
    c.fillRect(12,7,2,4);c.fillRect(16,7,2,4);c.fillRect(19,7,2,4);

  }

// ═══════════════════════════════════════════════════════
//  PARTICLE SYSTEM
// ═══════════════════════════════════════════════════════
class ParticleSystem {
  constructor() { this.p = []; }

  spawnBlood(wx, wy, count=7) {
    for (let i = 0; i < count; i++) {
      const angle = Math.random() * Math.PI * 2;
      const spd = 0.5 + Math.random() * 2.5;
      this.p.push({
        type: 0, // blood
        x: wx, y: wy,
        vx: Math.cos(angle) * spd,
        vy: Math.sin(angle) * spd - 1.5,
        life: 30 + Math.random() * 25,
        maxLife: 55,
        size: 2 + Math.random() * 3,
        g: 0.12,
      });
    }
  }

  spawnCrit(wx, wy, count=10) {
    for (let i = 0; i < count; i++) {
      const angle = (Math.PI * 2 * i / count) + Math.random() * 0.4;
      this.p.push({
        type: 1,
        x: wx, y: wy,
        vx: Math.cos(angle) * (1 + Math.random() * 1.5),
        vy: Math.sin(angle) * (1 + Math.random() * 1.5) - 1,
        life: 30 + Math.random() * 20, maxLife: 50,
        size: 2 + Math.random() * 4, g: 0, rgb: null,
      });
    }
  }

  spawnSpell(wx, wy, hexColor, count=12) {
    const num = parseInt(hexColor.replace('#',''), 16);
    const rgb = [(num>>16)&255, (num>>8)&255, num&255];
    for (let i = 0; i < count; i++) {
      const angle = (Math.PI * 2 * i / count) + Math.random() * 0.5;
      const spd = 0.8 + Math.random() * 2;
      this.p.push({
        type: 2,
        x: wx, y: wy,
        vx: Math.cos(angle) * spd,
        vy: Math.sin(angle) * spd - 0.8,
        life: 25 + Math.random() * 20, maxLife: 45,
        size: 2 + Math.random() * 5, g: -0.03, rgb,
      });
    }
  }

  spawnHeal(wx, wy, count=10) {
    for (let i = 0; i < count; i++) {
      this.p.push({
        type: 3,
        x: wx + (Math.random()-0.5)*20,
        y: wy + (Math.random()-0.5)*10,
        vx: (Math.random()-0.5)*0.8,
        vy: -(1 + Math.random() * 2),
        life: 35 + Math.random() * 20, maxLife: 55,
        size: 3 + Math.random() * 4, g: 0,
      });
    }
  }

  update() {
    for (const p of this.p) {
      p.x += p.vx; p.y += p.vy;
      p.vy += p.g;
      p.vx *= 0.92; p.vy *= 0.95;
      p.life--;
      p.size *= 0.97;
    }
    this.p = this.p.filter(p => p.life > 0 && p.size > 0.5);
  }

  draw(ctx, camX, camY) {
    for (const p of this.p) {
      const alpha = Math.min(1, p.life / (p.maxLife * 0.5));
      const sx = p.x - camX, sy = p.y - camY;
      if (p.type === 0) {
        const t = 1 - p.life / p.maxLife;
        ctx.fillStyle = `rgba(${180+Math.floor(50*t)},${Math.floor(20*(1-t))},0,${alpha})`;
      } else if (p.type === 1) {
        const t = 1 - p.life / p.maxLife;
        ctx.fillStyle = `rgba(${Math.floor(100+155*t)},120,255,${alpha})`;
      } else if (p.type === 2 && p.rgb) {
        const [r,g,b] = p.rgb;
        ctx.fillStyle = `rgba(${r},${g},${b},${alpha})`;
      } else if (p.type === 3) {
        // Heal: green rising sparkles
        ctx.fillStyle = `rgba(0,${Math.floor(180+75*p.life/p.maxLife)},80,${alpha})`;
      }
      const s = Math.max(1, p.size);
      ctx.fillRect(sx - s/2, sy - s/2, s, s);
    }
  }
}

// ═══════════════════════════════════════════════════════
//  RENDERER
// ═══════════════════════════════════════════════════════
class Renderer {
  constructor(canvas) {
    this.canvas = canvas;
    this.ctx = canvas.getContext('2d');
    this.ctx.imageSmoothingEnabled = false;
    this.tick = 0;
    this.sprites = new SpriteCache();
    this.sprites.build();
    this.particles = new ParticleSystem();
    this.mapW = 0; this.mapH = 0; this.uiW = 0; this.chatH = 0;
    this.spellBtnRects = [];
    // Pre-built tile canvases (keyed by type + tile coord for variety)
    this._tileCache = {};
  }

  resize(mapW, uiW, chatH) {
    this.mapW = mapW; this.uiW = uiW; this.chatH = chatH;
    this.canvas.width = mapW + uiW;
    this.canvas.height = window.innerHeight;
    this.mapH = window.innerHeight - chatH;
    this.ctx.imageSmoothingEnabled = false;
  }

  // ── Tile drawing (improved Tibia-style) ──
  _tile(ctx, sx, sy, type, tx, ty) {
    const T = TILE;
    const seed = ((tx * 7 + ty * 13) ^ (tx * ty)) & 0xFF;

    if (type === 'G') {
      // Grass: base + random blades
      ctx.fillStyle = '#3A7A1E';
      ctx.fillRect(sx, sy, T, T);
      // Subtle variation patches
      if (seed % 3 === 0) { ctx.fillStyle='#2E6A18'; ctx.fillRect(sx+seed%8,sy+seed%6,T/2,T/2); }
      ctx.fillStyle = '#2D6018';
      // Grass blades (deterministic)
      for (let i = 0; i < 8; i++) {
        const bx = ((seed*17+i*31)%T+T)%T;
        const by = ((seed*23+i*13)%T+T)%T;
        ctx.fillRect(sx+bx, sy+by, 2, 3);
        ctx.fillRect(sx+bx+1, sy+by-1, 1, 2);
      }
      ctx.fillStyle = '#448A24';
      for (let i = 0; i < 4; i++) {
        const bx = ((seed*11+i*41)%T+T)%T;
        const by = ((seed*29+i*19)%T+T)%T;
        ctx.fillRect(sx+bx, sy+by, 1, 2);
      }

    } else if (type === 'S') {
      // Stone floor: cobblestone 2x2 pattern
      const c = ['#666666','#5E5E5E','#6C6C6C','#595959'];
      const s = T/2;
      ctx.fillStyle = '#444';
      ctx.fillRect(sx, sy, T, T); // mortar
      ctx.fillStyle = c[seed%4];         ctx.fillRect(sx+1,   sy+1,   s-2, s-2);
      ctx.fillStyle = c[(seed+1)%4];     ctx.fillRect(sx+s+1, sy+1,   s-2, s-2);
      ctx.fillStyle = c[(seed+2)%4];     ctx.fillRect(sx+1,   sy+s+1, s-2, s-2);
      ctx.fillStyle = c[(seed+3)%4];     ctx.fillRect(sx+s+1, sy+s+1, s-2, s-2);
      // Stone highlights
      ctx.fillStyle='rgba(255,255,255,.12)';
      ctx.fillRect(sx+1, sy+1, s-2, 2);
      ctx.fillRect(sx+s+1, sy+s+1, s-2, 2);
      ctx.fillStyle='rgba(0,0,0,.2)';
      ctx.fillRect(sx+1, sy+s-3, s-2, 2);
      ctx.fillRect(sx+s+1, sy+T-3, s-2, 2);

    } else if (type === 'F') {
      // Dungeon floor: dark stone slabs
      ctx.fillStyle = '#282828';
      ctx.fillRect(sx, sy, T, T);
      ctx.fillStyle = '#222';
      ctx.fillRect(sx, sy, T, 1);  // top edge
      ctx.fillRect(sx, sy, 1, T);  // left edge
      // Crack detail
      if (seed % 5 === 0) {
        ctx.fillStyle = '#1A1A1A';
        ctx.fillRect(sx+seed%12+4, sy+seed%8+4, 8, 1);
        ctx.fillRect(sx+seed%12+8, sy+seed%8+4, 1, 6);
      }
      ctx.fillStyle='rgba(255,255,255,.05)';
      ctx.fillRect(sx+1, sy+1, T-2, 2);

    } else if (type === 'D') {
      // Dirt: earthy with pebble marks
      ctx.fillStyle = '#8B6914';
      ctx.fillRect(sx, sy, T, T);
      ctx.fillStyle = '#7A5A10';
      for (let i = 0; i < 5; i++) {
        const px = ((seed*13+i*21)%T+T)%T;
        const py = ((seed*17+i*11)%T+T)%T;
        ctx.fillRect(sx+px, sy+py, 3, 2);
      }
      ctx.fillStyle = '#9A7820';
      ctx.fillRect(sx+seed%10+2, sy+seed%8+2, 4, 3);

    } else if (type === 'N') {
      // Sand
      ctx.fillStyle = '#C8A850';
      ctx.fillRect(sx, sy, T, T);
      ctx.fillStyle = '#A88A30';
      for (let i = 0; i < 4; i++) {
        const px = ((seed*11+i*29)%T+T)%T;
        const py = ((seed*19+i*17)%T+T)%T;
        ctx.fillRect(sx+px, sy+py, 2, 2);
      }
      ctx.fillStyle='rgba(255,255,200,.15)';
      ctx.fillRect(sx+seed%16+2, sy+seed%12+2, 6, 2);

    } else if (type === 'W') {
      // Water: animated waves
      ctx.fillStyle = '#1A4A7A';
      ctx.fillRect(sx, sy, T, T);
      const wave = Math.sin(this.tick * 0.05 + tx * 0.5 + ty * 0.3);
      const wave2 = Math.sin(this.tick * 0.07 + tx * 0.3 - ty * 0.5);
      ctx.fillStyle = `rgba(80,140,220,${0.18 + wave*0.08})`;
      ctx.fillRect(sx, sy + Math.floor(T*0.3 + wave*2), T, 4);
      ctx.fillRect(sx, sy + Math.floor(T*0.65 + wave2*2), T, 3);
      ctx.fillStyle = `rgba(150,200,255,${0.12 + wave2*0.05})`;
      ctx.fillRect(sx + 2, sy + Math.floor(T*0.3 + wave*2) - 1, T-4, 2);

    } else if (type === 'X' || type === 'V') {
      // Walls: 3D stone brick
      const base = type === 'X' ? '#4A4040' : '#252020';
      const lit  = type === 'X' ? '#5A5050' : '#302828';
      const dark = type === 'X' ? '#333030' : '#181010';
      ctx.fillStyle = base;
      ctx.fillRect(sx, sy, T, T);
      // Brick rows
      ctx.fillStyle = dark;
      ctx.fillRect(sx, sy + T/2, T, 2);  // mortar row
      // Brick lines (offset each row)
      const off = (ty % 2 === 0) ? 0 : T/2;
      ctx.fillRect(sx + (T/2 - off + T) % T, sy, 2, T/2);
      ctx.fillRect(sx + off, sy + T/2, 2, T/2);
      // Top edge light
      ctx.fillStyle = lit;
      ctx.fillRect(sx, sy, T, 3);
      ctx.fillRect(sx, sy, 3, T);
      // Bottom shadow
      ctx.fillStyle = dark;
      ctx.fillRect(sx, sy + T-3, T, 3);
      ctx.fillRect(sx + T-3, sy, 3, T);

    } else if (type === 'T') {
      // Tree
      ctx.fillStyle = '#3A7A1E';
      ctx.fillRect(sx, sy, T, T);
      // Trunk
      ctx.fillStyle = '#5C3317';
      ctx.fillRect(sx+T*.38|0, sy+T*.55|0, T*.24|0, T*.45|0);
      ctx.fillStyle = '#7A4A25';
      ctx.fillRect(sx+T*.40|0, sy+T*.56|0, T*.08|0, T*.43|0);
      // Foliage (3 layers)
      ctx.fillStyle = '#1B5E20';
      ctx.fillRect(sx+3, sy+T*.2|0, T-6, T*.48|0);
      ctx.fillRect(sx+6, sy+T*.08|0, T-12, T*.28|0);
      ctx.fillStyle = '#2E7D32';
      ctx.fillRect(sx+6, sy+T*.22|0, T-12, T*.3|0);
      ctx.fillRect(sx+9, sy+T*.1|0, T-18, T*.2|0);
      // Highlight
      ctx.fillStyle = '#4CAF50';
      ctx.fillRect(sx+8, sy+T*.12|0, 5, 4);
      ctx.fillRect(sx+7, sy+T*.25|0, 5, 4);

    } else if (type === 'M') {
      // Mountain
      ctx.fillStyle = '#4A4040';
      ctx.fillRect(sx, sy, T, T);
      ctx.fillStyle = '#6D5C5C';
      ctx.fillRect(sx+2, sy+T*.5|0, T-4, T*.5|0);
      ctx.fillRect(sx+4, sy+T*.25|0, T-8, T*.35|0);
      ctx.fillRect(sx+8, sy+2, T-16, T*.3|0);
      // Snow cap
      ctx.fillStyle = '#EEE';
      ctx.fillRect(sx+10, sy+2, T-20, T*.18|0);
      ctx.fillRect(sx+12, sy+2, T-24, T*.1|0);
      // Shadow
      ctx.fillStyle = 'rgba(0,0,0,.3)';
      ctx.fillRect(sx+T/2, sy+T*.25|0, T/2, T*.75|0);

    } else if (type === 'L') {
      // Lava
      ctx.fillStyle = '#CC2200';
      ctx.fillRect(sx, sy, T, T);
      const lw = Math.sin(this.tick * 0.08 + tx + ty);
      ctx.fillStyle = `rgba(255,${100+Math.floor(lw*40)},0,0.6)`;
      ctx.fillRect(sx + 2, sy + Math.floor(T*0.3 + lw*3), T-4, 5);
      ctx.fillStyle = 'rgba(255,220,0,.3)';
      ctx.fillRect(sx + 6, sy + Math.floor(T*0.6 + lw*2), T-12, 3);
    } else {
      // Fallback
      ctx.fillStyle = TILE_DEF[type]?.[0] || '#333';
      ctx.fillRect(sx, sy, T, T);
    }
  }

  // ── Entity drawing using pre-rendered sprites ──
  _shadow(ctx, sx, sy) {
    ctx.fillStyle = 'rgba(0,0,0,.35)';
    ctx.beginPath();
    ctx.ellipse(sx + TILE/2, sy + TILE - 4, TILE*0.32, TILE*0.11, 0, 0, Math.PI*2);
    ctx.fill();
  }

  _drawEntity(ctx, sx, sy, spriteKey, flashKey, flashTick) {
    const spr = this.sprites.get(flashTick > 0 && flashTick % 2 === 0 ? flashKey : spriteKey);
    if (spr) ctx.drawImage(spr, sx - 1, sy - 1);
  }

  _hpBar(ctx, sx, sy, hp, maxHp, name, nameColor) {
    const T = TILE;
    const bw = T + 8, bh = 5;
    const bx = sx + (T - bw)/2, by = sy - 14;
    // Background
    ctx.fillStyle = '#111';
    ctx.fillRect(bx, by, bw, bh);
    ctx.fillStyle = '#333';
    ctx.fillRect(bx+1, by+1, bw-2, bh-2);
    // Fill
    const pct = Math.max(0, hp/maxHp);
    ctx.fillStyle = pct > 0.6 ? '#00CC00' : pct > 0.3 ? '#CCCC00' : '#CC0000';
    if (pct > 0) ctx.fillRect(bx+1, by+1, Math.floor((bw-2)*pct), bh-2);
    // Name label
    ctx.font = 'bold 9px monospace';
    const nw = ctx.measureText(name).width;
    ctx.fillStyle = 'rgba(0,0,0,.7)';
    ctx.fillRect(sx+T/2-nw/2-2, sy-26, nw+4, 12);
    ctx.fillStyle = nameColor;
    ctx.fillText(name, sx+T/2-nw/2, sy-16);
  }

  render(world) {
    this.tick++;
    const ctx = this.ctx;
    const p = world.player;
    const mW = this.mapW, mH = this.mapH;
    const uiX = mW, uiW = this.uiW;
    const cH = this.chatH;
    const W = mW + uiW, H = mH + cH;
    const T = TILE;

    // Camera (centered on player)
    const camX = Math.floor(p.x * T - mW/2 + T/2);
    const camY = Math.floor(p.y * T - mH/2 + T/2);

    // Clip to map area
    ctx.save();
    ctx.beginPath();
    ctx.rect(0, 0, mW, mH);
    ctx.clip();

    // ── TILES ────────────────────────────────────────
    const startC = Math.max(0, Math.floor(camX/T));
    const endC   = Math.min(MAP_W-1, Math.floor((camX+mW)/T)+1);
    const startR = Math.max(0, Math.floor(camY/T));
    const endR   = Math.min(MAP_H-1, Math.floor((camY+mH)/T)+1);

    for (let r = startR; r <= endR; r++) {
      for (let col = startC; col <= endC; col++) {
        this._tile(ctx, col*T-camX, r*T-camY, world.map.get(col,r), col, r);
      }
    }

    // ── PARTICLES (below entities) ────────────────────
    // Process new events
    for (const ev of world.events) {
      const px = ev.x * T + T/2, py = ev.y * T + T/2;
      if (ev.t === 'blood') this.particles.spawnBlood(px, py);
      else if (ev.t === 'crit') this.particles.spawnCrit(px, py);
      else if (ev.t === 'heal') this.particles.spawnHeal(px, py);
      else if (ev.t === 'spell') this.particles.spawnSpell(px, py, ev.color||'#FFFFFF');
    }
    world.events = [];
    this.particles.update();
    this.particles.draw(ctx, camX, camY);

    // ── MONSTERS ─────────────────────────────────────
    for (const m of world.monsters) {
      if (!m.alive) continue;
      const sx = m.x*T-camX, sy = m.y*T-camY;
      if (sx < -T*2 || sy < -T*2 || sx > mW+T || sy > mH+T) continue;
      this._shadow(ctx, sx, sy);
      this._drawEntity(ctx, sx, sy, `m_${m.monIdx}`, `m_${m.monIdx}_f`, m.flashTick);
      this._hpBar(ctx, sx, sy, m.hp, m.maxHp, m.name, m.color);
    }

    // ── PLAYER ───────────────────────────────────────
    const psx = p.x*T-camX, psy = p.y*T-camY;
    this._shadow(ctx, psx, psy);
    this._drawEntity(ctx, psx, psy, `p_${p.voc}`, `p_${p.voc}_f`, p.flashTick);
    // Player name
    ctx.font = 'bold 10px monospace';
    const pnw = ctx.measureText(p.name).width;
    ctx.fillStyle = 'rgba(0,0,0,.75)';
    ctx.fillRect(psx+T/2-pnw/2-2, psy-26, pnw+4, 12);
    ctx.fillStyle = '#00FF88';
    ctx.fillText(p.name, psx+T/2-pnw/2, psy-16);

    // ── PROJECTILES ──────────────────────────────────
    for (const pr of world.projectiles) {
      const cx = (pr.sx + (pr.tx-pr.sx)*pr.progress) * T - camX + T/2;
      const cy = (pr.sy + (pr.ty-pr.sy)*pr.progress) * T - camY + T/2;
      // Trail
      ctx.globalAlpha = 0.3;
      ctx.strokeStyle = pr.color; ctx.lineWidth = 2;
      ctx.beginPath();
      ctx.moveTo(pr.sx*T-camX+T/2, pr.sy*T-camY+T/2);
      ctx.lineTo(cx, cy);
      ctx.stroke();
      ctx.globalAlpha = 1;
      // Orb
      ctx.fillStyle = pr.color;
      ctx.beginPath(); ctx.arc(cx, cy, 5, 0, Math.PI*2); ctx.fill();
      ctx.fillStyle = '#FFF';
      ctx.beginPath(); ctx.arc(cx-1, cy-1, 2, 0, Math.PI*2); ctx.fill();
    }

    // ── FLOATING DAMAGE TEXTS ────────────────────────
    for (const f of world.floats) {
      const sx = f.x*T - camX + T/2;
      const sy = f.y - camY;
      const alpha = Math.min(1, f.ttl / 30);
      ctx.globalAlpha = alpha;
      ctx.font = `bold ${Math.floor(15 + (1-alpha)*4)}px monospace`;
      const tw = ctx.measureText(f.text).width;
      // Outline
      ctx.strokeStyle = '#000'; ctx.lineWidth = 3;
      ctx.strokeText(f.text, sx - tw/2, sy);
      ctx.fillStyle = f.color;
      ctx.fillText(f.text, sx - tw/2, sy);
      ctx.globalAlpha = 1;
    }

    ctx.restore();

    // ── MAP BORDER ───────────────────────────────────
    ctx.strokeStyle = '#5C3317'; ctx.lineWidth = 2;
    ctx.strokeRect(0, 0, mW, mH);

    // ── UI PANEL ─────────────────────────────────────
    ctx.fillStyle = '#0C0700';
    ctx.fillRect(uiX, 0, uiW, mH);
    ctx.strokeStyle = '#6B4010'; ctx.lineWidth = 2;
    ctx.strokeRect(uiX, 0, uiW, mH);
    this._drawUI(ctx, world, uiX, uiW, mH);

    // ── CHAT BOX ─────────────────────────────────────
    ctx.fillStyle = '#080400';
    ctx.fillRect(0, mH, W, cH);
    ctx.strokeStyle = '#5C3317'; ctx.lineWidth = 1;
    ctx.strokeRect(0, mH, W, cH);
    this._drawChat(ctx, world, mH, W, cH);

    // ── DEATH OVERLAY ────────────────────────────────
    if (!p.alive) {
      ctx.fillStyle = 'rgba(0,0,0,.8)';
      ctx.fillRect(0, 0, W, H);
      ctx.font = 'bold 48px monospace';
      ctx.strokeStyle = '#000'; ctx.lineWidth = 4;
      const dm = 'VOCÊ MORREU';
      const dmx = W/2 - ctx.measureText(dm).width/2;
      ctx.strokeText(dm, dmx, H/2-20);
      ctx.fillStyle = '#CC0000';
      ctx.fillText(dm, dmx, H/2-20);
      ctx.font = '20px monospace';
      const sub = `Nível ${p.level} · ${p.gold} gold`;
      ctx.fillStyle = '#FFD700';
      ctx.fillText(sub, W/2-ctx.measureText(sub).width/2, H/2+30);
    }
  }

  _drawUI(ctx, world, ux, uw, uh) {
    this.spellBtnRects = [];
    const p = world.player;
    let y = 14;
    const tx = ux+8, tw = uw-16;

    const label = (text, color, bold) => {
      ctx.font = (bold?'bold ':'') + '12px monospace';
      ctx.fillStyle = color; ctx.fillText(text, tx, y); y += 18;
    };
    const bar = (pct, fillColor, text, emptyColor) => {
      ctx.fillStyle = emptyColor || '#1a0e05';
      ctx.fillRect(tx, y, tw, 13);
      ctx.fillStyle = fillColor;
      if (pct > 0) ctx.fillRect(tx, y, Math.floor(tw*Math.max(0,Math.min(1,pct))), 13);
      // Bar border
      ctx.strokeStyle = '#3A2010'; ctx.lineWidth = 1;
      ctx.strokeRect(tx, y, tw, 13);
      ctx.font = '9px monospace'; ctx.fillStyle = '#FFF';
      ctx.fillText(text, tx+3, y+10); y += 17;
    };
    const divider = () => {
      ctx.strokeStyle = '#5C3317'; ctx.lineWidth = 1;
      ctx.beginPath(); ctx.moveTo(ux+4, y); ctx.lineTo(ux+uw-4, y); ctx.stroke();
      y += 8;
    };

    label(p.name, '#FFD700', true);
    label(`${p.voc}  Lv.${p.level}`, '#C8A860', false);
    label(`Gold: ${p.gold}`, '#FFD700', false);
    divider();
    bar(p.hp/p.maxHp, p.hp/p.maxHp>.6?'#008800':p.hp/p.maxHp>.3?'#888800':'#880000', `HP ${p.hp}/${p.maxHp}`);
    bar(p.maxMp>0?p.mp/p.maxMp:0, '#004488', `MP ${p.mp}/${p.maxMp}`);
    bar(p.xpNext>0?p.xp/p.xpNext:0, '#226600', `XP ${p.xp}/${p.xpNext}`);
    divider();
    label(`ATK: ${p.totalAtk}  DEF: ${p.totalDef}`, '#AAAAAA', false);
    divider();
    label('EQUIPADO:', '#FFD700', true);
    const slots = {weapon:'⚔',armor:'🛡',helmet:'⛑',shield:'🔰'};
    for (const [sl, ic] of Object.entries(slots)) {
      const eq = p.eq[sl];
      label(eq ? `${ic} ${ITEMS[eq].n}` : `${ic} —`, eq ? '#88FF88' : '#444444', false);
    }
    divider();
    const hpPots = Object.entries(p.inv).filter(([id])=>ITEMS[id]?.t==='potion'&&ITEMS[id]?.hp>0).reduce((s,[,c])=>s+c,0);
    const mpPots = Object.entries(p.inv).filter(([id])=>ITEMS[id]?.t==='potion'&&ITEMS[id]?.mp>0).reduce((s,[,c])=>s+c,0);
    label(`❤ HP Pots: ${hpPots}`, '#CC4444', false);
    label(`✦ MP Pots: ${mpPots}`, '#4444CC', false);
    divider();
    const nearby = world.monsters
      .filter(m => m.alive && Math.max(Math.abs(m.x-p.x), Math.abs(m.y-p.y)) <= 8)
      .sort((a,b) => Math.max(Math.abs(a.x-p.x),Math.abs(a.y-p.y)) - Math.max(Math.abs(b.x-p.x),Math.abs(b.y-p.y)))
      .slice(0, 4);
    if (nearby.length) {
      label('INIMIGOS:', '#FF4444', true);
      for (const m of nearby) {
        if (y > uh - 22) break;
        ctx.fillStyle = '#1a0e05'; ctx.fillRect(tx, y, tw, 11);
        const hp = Math.max(0, m.hp/m.maxHp);
        ctx.fillStyle = hp>.6?'#006600':hp>.3?'#666600':'#660000';
        if (hp > 0) ctx.fillRect(tx, y, Math.floor(tw*hp), 11);
        ctx.strokeStyle = '#3A2010'; ctx.lineWidth = 1;
        ctx.strokeRect(tx, y, tw, 11);
        ctx.font = '8px monospace'; ctx.fillStyle = '#FFF';
        ctx.fillText(`${m.name} ${m.hp}/${m.maxHp}`, tx+2, y+9);
        y += 14;
      }
    }
    // ── SPELL BAR ──
    divider();
    const allSpells = SPELLS[p.voc] || [];
    const avail = allSpells.filter(s => p.level >= s.lvl);
    if (allSpells.length) {
      label('MAGIAS:', '#CC88FF', true);
      this.spellBtnRects = [];
      for (let i = 0; i < allSpells.length; i++) {
        if (y > uh - 16) break;
        const s = allSpells[i];
        const locked = p.level < s.lvl;
        const cd = p.spellCds[s.id] || 0;
        const onCd = cd > 0;
        // Background button
        ctx.fillStyle = locked ? '#111' : onCd ? '#2A1A00' : '#1A0E2A';
        ctx.fillRect(tx, y, tw, 20);
        ctx.strokeStyle = locked ? '#333' : s.color;
        ctx.lineWidth = 1;
        ctx.strokeRect(tx, y, tw, 20);
        // Number key
        ctx.font = 'bold 10px monospace';
        ctx.fillStyle = locked ? '#444' : s.color;
        ctx.fillText(`[${i+1}]`, tx+2, y+14);
        // Name
        ctx.fillStyle = locked ? '#555' : onCd ? '#888' : '#DDD';
        ctx.fillText(s.name, tx+24, y+14);
        // MP cost (right-aligned)
        ctx.fillStyle = locked ? '#333' : '#4488FF';
        ctx.font = '9px monospace';
        ctx.fillText(`${s.mp}mp`, tx+tw-28, y+13);
        // Cooldown bar
        if (onCd) {
          ctx.fillStyle = '#FF8800';
          ctx.fillRect(tx, y+18, Math.floor(tw*(1-cd/s.cd)), 2);
        }
        // Level lock label
        if (locked) {
          ctx.fillStyle = '#555';
          ctx.fillText(`Lv.${s.lvl}`, tx+tw-28, y+13);
        }
        if (!locked) this.spellBtnRects.push({idx:avail.indexOf(s), x:8, y, w:tw, h:20});
        y += 23;
      }
    }
  }

  _drawChat(ctx, world, cy, W, cH) {
    const msgs = world.chat.slice(-5);
    ctx.font = '11px monospace';
    msgs.forEach((m, i) => {
      ctx.fillStyle = m.color;
      ctx.fillText(m.msg.substring(0, Math.floor(W/7.2)), 7, cy+15+i*18);
    });
  }
}

// ═══════════════════════════════════════════════════════
//  GAME LOOP & INPUT
// ═══════════════════════════════════════════════════════
let world, renderer, running = false;
let heldDir = null, heldInterval = null;

function setupLayout() {
  const W = window.innerWidth, H = window.innerHeight;
  const chatH = Math.max(60, Math.min(100, H*.18));
  const uiW   = Math.max(160, Math.min(240, W*.28));
  TILE = Math.max(24, Math.min(40, Math.floor((H-chatH)/13)));
  const mapW = W - uiW;
  renderer.resize(mapW, uiW, chatH);

  const btnSz = Math.max(44, Math.min(60, W*.07));
  const dpad = document.getElementById('dpad');
  dpad.style.cssText = `position:absolute;bottom:${chatH+6}px;left:6px;display:grid;grid-template-columns:${btnSz}px ${btnSz}px ${btnSz}px;grid-template-rows:${btnSz}px ${btnSz}px ${btnSz}px;gap:3px;pointer-events:all`;
  document.querySelectorAll('.dp').forEach(d => {
    d.style.width  = btnSz+'px';
    d.style.height = btnSz+'px';
    d.style.fontSize = Math.floor(btnSz*.42)+'px';
  });

  const abW = Math.floor(btnSz*1.1), abH = Math.floor(btnSz*.9);
  const ab = document.getElementById('actionBtns');
  ab.style.cssText = `position:absolute;bottom:${chatH+6}px;left:${btnSz*3+18}px;display:flex;gap:6px;pointer-events:all`;
  document.querySelectorAll('.abtn').forEach(b => {
    b.style.width  = abW+'px';
    b.style.height = abH+'px';
    b.style.fontSize = Math.floor(abW*.22)+'px';
  });

  // Spell bar — full-width strip above the d-pad row
  const dpadH = btnSz * 3 + 6;
  const sbH = Math.max(52, Math.round(btnSz * .9));
  const sb = document.getElementById('spellBar');
  sb.style.cssText = `position:absolute;bottom:${chatH+6+dpadH+5}px;left:0;right:0;height:${sbH}px;padding:0 5px;gap:4px;display:flex;align-items:center;pointer-events:all;overflow-x:auto;overflow-y:hidden;-webkit-overflow-scrolling:touch;scrollbar-width:none`;
  if (world) updateSpellBar(true);
}

let _sbVoc = null, _sbLvl = -1;
function updateSpellBar(force) {
  if (!world) return;
  const p = world.player;
  const allSpells = SPELLS[p.voc] || [];
  const avail = allSpells.filter(s => p.level >= s.lvl);
  const bar = document.getElementById('spellBar');
  if (!bar) return;

  if (force || p.voc !== _sbVoc || p.level !== _sbLvl) {
    _sbVoc = p.voc; _sbLvl = p.level;
    bar.innerHTML = '';
    const W = window.innerWidth;
    const btnSz = Math.max(44, Math.min(60, W * .07));
    const sbH = Math.max(52, Math.round(btnSz * .9));
    const n = allSpells.length || 1;
    const sbW = Math.max(56, Math.floor((W - 10 - 4 * (n - 1)) / n));
    allSpells.forEach(spell => {
      const locked = p.level < spell.lvl;
      const idx = avail.indexOf(spell);
      const btn = document.createElement('button');
      btn.className = 'sbtn' + (locked ? ' locked' : '');
      btn.dataset.sid = spell.id;
      btn.dataset.scd = spell.cd;
      btn.style.cssText = `width:${sbW}px;height:${sbH}px;min-width:${sbW}px;border-color:${spell.color}`;
      const ws = spell.name.split(/\s+/);
      const abbr = ws.length > 1
        ? ws.map(w => (w.replace(/[^a-z]/gi,'') || 'X')[0].toUpperCase()).join('').slice(0, 4)
        : spell.name.replace(/[^a-z]/gi,'').slice(0, 4).toUpperCase();
      const fs1 = Math.max(11, Math.floor(sbH * .22));
      const fs2 = Math.max(9,  Math.floor(sbH * .17));
      btn.innerHTML =
        `<span style="font-size:${fs1}px;font-weight:bold;color:${locked?'#777':spell.color}">${abbr}</span>`+
        `<span style="font-size:${fs2}px;color:${locked?'#555':'#8899CC'}">${spell.mp}mp</span>`+
        (locked ? `<span style="font-size:${Math.max(8,fs2-1)}px;color:#555">Lv${spell.lvl}</span>` : '')+
        `<span class="scd-ov" style="width:0%"></span>`;
      if (!locked) {
        const cast = () => { if (world) world.castSpell(idx); };
        btn.addEventListener('touchstart', e => { e.preventDefault(); cast(); }, {passive:false});
        btn.addEventListener('click', cast);
      }
      bar.appendChild(btn);
    });
  }

  // Update cooldown overlays every frame
  bar.querySelectorAll('.sbtn:not(.locked)').forEach(btn => {
    const cd = world.player.spellCds[btn.dataset.sid] || 0;
    const ov = btn.querySelector('.scd-ov');
    if (ov) ov.style.width = (cd > 0 ? Math.round(cd / btn.dataset.scd * 100) : 0) + '%';
  });
}

function startGame(name, voc) {
  document.getElementById('charSelect').style.display = 'none';
  document.getElementById('gameWrap').style.display   = 'block';
  const canvas = document.getElementById('gameCanvas');
  renderer = new Renderer(canvas);
  const player = new Player(30, 30, name||'Herói', voc||'Knight');
  world = new World(player);
  setupLayout();
  bindInput();
  running = true;
  loop();
}

function loop() {
  if (!running) return;
  world.update();
  renderer.render(world);
  updateSpellBar();
  setTimeout(loop, 33);
}

function doMove(dir) {
  const p = world.player; if (!p.alive) return;
  const m = {up:[0,-1],down:[0,1],left:[-1,0],right:[1,0]};
  const [dx,dy] = m[dir]||[0,0];
  const nx = p.x+dx, ny = p.y+dy;
  if (world.map.passable(nx,ny)) { p.x=nx; p.y=ny; }
}

function bindInput() {
  document.getElementById('dpad').querySelectorAll('[data-dir]').forEach(btn => {
    const dir = btn.dataset.dir;
    if (dir === 'attack') { btn.addEventListener('click', ()=>world.attackNearest()); return; }
    const start = () => {
      doMove(dir); heldDir=dir; btn.classList.add('active');
      clearInterval(heldInterval);
      heldInterval = setInterval(()=>doMove(heldDir), 180);
    };
    const stop = () => {
      if (heldDir===dir){heldDir=null;clearInterval(heldInterval);}
      btn.classList.remove('active');
    };
    btn.addEventListener('touchstart', e=>{e.preventDefault();start();},{passive:false});
    btn.addEventListener('touchend',   e=>{e.preventDefault();stop();}, {passive:false});
    btn.addEventListener('mousedown', start);
    btn.addEventListener('mouseup',   stop);
    btn.addEventListener('mouseleave',stop);
  });

  document.getElementById('btnHp').addEventListener('click', ()=>world.useHpPotion());
  document.getElementById('btnMp').addEventListener('click', ()=>world.useMpPotion());
  document.getElementById('btnInv').addEventListener('click', openInventory);

  const keyMap = {ArrowUp:'up',ArrowDown:'down',ArrowLeft:'left',ArrowRight:'right',
                  w:'up',s:'down',a:'left',d:'right',W:'up',S:'down',A:'left',D:'right'};
  document.addEventListener('keydown', e => {
    if (!world||!running) return;
    if (keyMap[e.key]) { e.preventDefault(); doMove(keyMap[e.key]); }
    else if (e.key==='f'||e.key==='F') world.attackNearest();
    else if (e.key==='p'||e.key==='P') world.useHpPotion();
    else if (e.key==='m'||e.key==='M') world.useMpPotion();
    else if (e.key==='i'||e.key==='I') openInventory();
    else if ('12345'.includes(e.key)) world.castSpell(+e.key-1);
  });

  const canvas = document.getElementById('gameCanvas');
  const onTap = (cx, cy) => {
    if (!world) return;
    // Tap in UI panel — check spell buttons
    if (cx >= renderer.mapW) {
      const relX = cx - renderer.mapW;
      for (const btn of renderer.spellBtnRects) {
        if (relX >= btn.x && relX <= btn.x+btn.w && cy >= btn.y && cy <= btn.y+btn.h) {
          world.castSpell(btn.idx); return;
        }
      }
      return;
    }
    if (cy > renderer.mapH) return;
    const camX = world.player.x*TILE - renderer.mapW/2 + TILE/2;
    const camY = world.player.y*TILE - renderer.mapH/2 + TILE/2;
    const wx = Math.floor((cx+camX)/TILE);
    const wy = Math.floor((cy+camY)/TILE);
    const m = world.monsters.find(m=>m.alive&&m.x===wx&&m.y===wy);
    if (m) world.attackMonster(m);
  };
  canvas.addEventListener('click', e => { const r=canvas.getBoundingClientRect(); onTap(e.clientX-r.left,e.clientY-r.top); });
  canvas.addEventListener('touchend', e => {
    const t=e.changedTouches[0];
    const r=canvas.getBoundingClientRect();
    onTap(t.clientX-r.left, t.clientY-r.top);
  },{passive:true});

  window.addEventListener('resize', ()=>{ if(renderer) setupLayout(); });
}

// ─── INVENTORY ────────────────────────────────────────
function openInventory() {
  const p = world.player;
  const modal = document.getElementById('invModal');
  document.getElementById('invTitle').textContent = `INVENTÁRIO — ${p.name} (Lv.${p.level})`;
  let html = `<div style="color:#FFD700;font-size:13px">Gold: ${p.gold} | ATK: ${p.totalAtk} | DEF: ${p.totalDef}</div>`;
  html += `<div class="inv-section-title">EQUIPADO</div>`;
  const slotN = {weapon:'Arma',armor:'Armor',helmet:'Capacete',shield:'Escudo'};
  for (const [sl,label] of Object.entries(slotN)) {
    const id = p.eq[sl];
    if (id) {
      const it = ITEMS[id];
      html += `<div class="inv-item"><span class="inv-item-name" style="color:#88FF88">${label}: ${it.n} (${it.atk?`ATK+${it.atk}`:`DEF+${it.def}`})</span></div>`;
    }
  }
  html += `<div class="inv-section-title">ITENS</div>`;
  for (const [idStr,cnt] of Object.entries(p.inv)) {
    const id = +idStr, it = ITEMS[id]; if (!it) continue;
    let extra='', action='';
    if (it.t==='potion') { extra=it.hp?`HP+${it.hp}`:`MP+${it.mp}`; action=`<button class="inv-btn" onclick="useItem(${id})">USAR</button>`; }
    else if (['weapon','armor','helmet','shield'].includes(it.t)) { extra=it.atk?`ATK+${it.atk}`:`DEF+${it.def}`; action=`<button class="inv-btn" onclick="equipItem(${id})">EQUIPAR</button>`; }
    html += `<div class="inv-item"><span class="inv-item-name">${it.n} x${cnt} <span style="color:#888;font-size:11px">${extra}</span></span>${action}</div>`;
  }
  document.getElementById('invContent').innerHTML = html;
  modal.classList.add('show');
}
window.useItem   = id => { world.player.usePotion(id); openInventory(); };
window.equipItem = id => { world.player.equip(id); world.log(`Equipou ${ITEMS[id].n}!`,'#88FF88'); openInventory(); };
document.getElementById('invClose').addEventListener('click', ()=>document.getElementById('invModal').classList.remove('show'));

// ─── CHARACTER SELECT ─────────────────────────────────
const vocList = Object.keys(VOCATIONS);
let selVoc = 0;
const grid = document.getElementById('vocGrid');
vocList.forEach((v, i) => {
  const btn = document.createElement('div');
  btn.className = 'voc-btn' + (i===0?' sel':'');
  btn.innerHTML = `<div class="vname" style="color:${VOCATIONS[v].color}">${v}</div><div class="vdesc">${VOCATIONS[v].desc}</div>`;
  btn.onclick = () => {
    selVoc = i;
    grid.querySelectorAll('.voc-btn').forEach((b,j)=>b.classList.toggle('sel',j===i));
  };
  grid.appendChild(btn);
});
document.getElementById('startBtn').addEventListener('click', () => {
  const name = document.getElementById('nameInput').value.trim()||'Herói';
  startGame(name, vocList[selVoc]);
});
document.getElementById('nameInput').addEventListener('keydown', e=>{
  if (e.key==='Enter') document.getElementById('startBtn').click();
});
</script>
