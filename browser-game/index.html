<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Tibia Android</title>
<style>
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{width:100%;height:100%;background:#0a0500;overflow:hidden;font-family:'Courier New',monospace;touch-action:none;user-select:none}
#charSelect{position:fixed;inset:0;background:radial-gradient(ellipse at center,#2d1a0a 0%,#0a0500 100%);display:flex;flex-direction:column;align-items:center;justify-content:center;color:#E8D5B7;z-index:100;padding:20px}
#charSelect h1{color:#FFD700;font-size:clamp(24px,5vw,48px);text-shadow:0 0 20px #FF8C00;margin-bottom:4px;letter-spacing:4px}
#charSelect .sub{color:#8B6914;font-size:14px;margin-bottom:24px}
.cs-section{width:100%;max-width:500px;margin-bottom:16px}
.cs-label{color:#FFD700;font-size:13px;margin-bottom:6px;text-transform:uppercase;letter-spacing:1px}
.cs-input{width:100%;background:#1a0e05;border:2px solid #8B6914;color:#FFD700;padding:10px 14px;font-size:18px;font-family:inherit;outline:none;border-radius:4px}
.cs-input:focus{border-color:#FFD700}
.voc-grid{display:grid;grid-template-columns:1fr 1fr;gap:8px;width:100%;max-width:500px}
.voc-btn{background:#1a0e05;border:2px solid #5C3317;color:#E8D5B7;padding:12px;cursor:pointer;border-radius:4px;text-align:left;transition:all .2s}
.voc-btn:hover,.voc-btn.sel{border-color:#FFD700;background:#2d1a0a;color:#FFD700}
.voc-btn .vname{font-size:16px;font-weight:bold;margin-bottom:4px}
.voc-btn .vdesc{font-size:11px;color:#8B8B8B}
.voc-btn.sel .vdesc{color:#C8A860}
#startBtn{background:#8B6914;border:none;color:#000;padding:14px 40px;font-size:20px;font-family:inherit;font-weight:bold;cursor:pointer;border-radius:4px;margin-top:8px;letter-spacing:2px;transition:background .2s;width:100%;max-width:500px}
#startBtn:hover{background:#FFD700}
#continueBtn{background:#1a0e05;border:2px solid #44AA44;color:#44FF88;padding:14px 40px;font-size:18px;font-family:inherit;font-weight:bold;cursor:pointer;border-radius:4px;margin-bottom:8px;letter-spacing:2px;width:100%;max-width:500px;display:none}
#continueBtn:hover{background:#112211;border-color:#88FF88}
.save-info{color:#5C9A5C;font-size:12px;text-align:center;margin-bottom:6px;width:100%;max-width:500px;display:none}
#gameWrap{display:none;width:100vw;height:100vh;position:relative}
#gameCanvas{display:block;position:absolute;top:0;left:0}
#dpad{position:absolute;pointer-events:all}
.dp{background:rgba(40,20,0,.75);border:2px solid #7A4A1A;border-radius:8px;display:flex;align-items:center;justify-content:center;color:#E8C060;cursor:pointer;-webkit-user-select:none;font-weight:bold}
.dp:active,.dp.active{background:rgba(139,105,20,.9);color:#FFD700;border-color:#FFD700}
#actionBtns{position:absolute;display:flex;gap:6px;pointer-events:all}
.abtn{background:rgba(40,20,0,.8);border:2px solid #7A4A1A;border-radius:8px;color:#E8D5B7;font-family:inherit;cursor:pointer;display:flex;flex-direction:column;align-items:center;justify-content:center;font-weight:bold;line-height:1.2;-webkit-user-select:none}
.abtn:active{background:rgba(139,105,20,.9);color:#FFD700}
#spellBar{position:absolute;display:flex;align-items:center;pointer-events:all;overflow-x:auto;overflow-y:hidden;-webkit-overflow-scrolling:touch;scrollbar-width:none}
#spellBar::-webkit-scrollbar{display:none}
.sbtn{background:rgba(15,8,0,.9);border:2px solid #7A4A1A;border-radius:6px;color:#E8D5B7;font-family:inherit;cursor:pointer;display:flex;flex-direction:column;align-items:center;justify-content:center;line-height:1.1;-webkit-user-select:none;position:relative;overflow:hidden;flex-shrink:0;padding:0}
.sbtn:active{background:rgba(100,70,10,.95)}
.sbtn.locked{opacity:.32}
.sbtn .scd-ov{position:absolute;left:0;top:0;bottom:0;background:rgba(0,0,0,.58);pointer-events:none}
#invModal{display:none;position:fixed;inset:0;background:rgba(0,0,0,.85);z-index:200;align-items:center;justify-content:center}
#invModal.show{display:flex}
#invBox{background:#1a0e05;border:3px solid #8B6914;padding:16px;max-width:400px;width:90%;max-height:80vh;overflow-y:auto;border-radius:4px;color:#E8D5B7}
#invBox h2{color:#FFD700;font-size:18px;margin-bottom:12px;text-align:center}
.inv-section-title{color:#FFD700;font-size:13px;margin:10px 0 4px;border-bottom:1px solid #5C3317;padding-bottom:2px}
.inv-item{display:flex;align-items:center;justify-content:space-between;padding:4px 0;border-bottom:1px solid #2d1a0a;font-size:13px}
.inv-item-name{flex:1}
.inv-btn{background:#3d1f08;border:1px solid #8B6914;color:#FFD700;padding:3px 8px;font-size:11px;cursor:pointer;border-radius:3px;font-family:inherit}
.inv-btn:hover{background:#8B6914;color:#000}
#invClose{margin-top:12px;width:100%;background:#8B6914;border:none;color:#000;padding:10px;font-size:16px;font-family:inherit;font-weight:bold;cursor:pointer;border-radius:4px}
#invClose:hover{background:#FFD700}
#shopModal{display:none;position:fixed;inset:0;background:rgba(0,0,0,.88);z-index:200;align-items:center;justify-content:center}
#shopModal.show{display:flex}
#shopBox{background:#0e0800;border:3px solid #8B6914;padding:16px;max-width:420px;width:92%;max-height:82vh;overflow-y:auto;border-radius:4px;color:#E8D5B7}
#shopBox h2{color:#FFD700;font-size:17px;margin-bottom:10px;text-align:center}
#shopTabs{display:flex;gap:8px;margin-bottom:10px}
.stab{flex:1;background:#1a0e05;border:2px solid #5C3317;color:#C8A860;padding:8px;font-family:inherit;font-size:13px;font-weight:bold;cursor:pointer;border-radius:4px;letter-spacing:1px}
.stab.active{border-color:#FFD700;color:#FFD700;background:#2d1a0a}
.shop-gold{color:#FFD700;font-size:13px;margin-bottom:8px}
.shop-item{display:flex;align-items:center;gap:6px;padding:5px 0;border-bottom:1px solid #2d1a0a;font-size:13px}
.shop-item-name{flex:1}
#shopClose{margin-top:12px;width:100%;background:#8B6914;border:none;color:#000;padding:10px;font-size:16px;font-family:inherit;font-weight:bold;cursor:pointer;border-radius:4px}
#shopClose:hover{background:#FFD700}
#deathModal{display:none;position:fixed;inset:0;background:rgba(0,0,0,.92);z-index:300;align-items:center;justify-content:center;flex-direction:column}
#deathModal.show{display:flex}
#deathBox{background:#0a0000;border:3px solid #CC0000;padding:28px 24px;max-width:340px;width:88%;border-radius:6px;text-align:center;color:#E8D5B7}
#deathBox h2{color:#CC0000;font-size:36px;letter-spacing:3px;margin-bottom:6px;text-shadow:0 0 20px #FF0000}
.death-sub{color:#888;font-size:14px;margin-bottom:20px}
.death-info{background:#110000;border:1px solid #441111;border-radius:4px;padding:12px;margin-bottom:16px;font-size:14px}
.death-info .di-row{display:flex;justify-content:space-between;padding:3px 0}
.di-label{color:#888}
.di-val{color:#FFD700;font-weight:bold}
.di-penalty{color:#FF4444}
.death-town{color:#88FF88;font-size:13px;margin-bottom:20px}
#btnRespawn{width:100%;background:#8B0000;border:2px solid #CC0000;color:#FFD700;padding:16px;font-size:18px;font-family:inherit;font-weight:bold;cursor:pointer;border-radius:4px;letter-spacing:2px}
#btnRespawn:active{background:#CC0000}
</style>
</head>
<body>

<div id="charSelect">
  <h1>TIBIA ANDROID</h1>
  <div class="sub">Offline Single Player com IA</div>
  <div class="cs-section">
    <div class="cs-label">Nome do Personagem</div>
    <input class="cs-input" id="nameInput" type="text" value="Herói" maxlength="16" autocomplete="off">
  </div>
  <div class="cs-label" style="width:100%;max-width:500px;margin-bottom:8px">Escolha sua Vocação</div>
  <div class="voc-grid" id="vocGrid"></div>
  <div class="save-info" id="saveInfo"></div>
  <button id="continueBtn" onclick="loadGame()">▶ CONTINUAR JOGO</button>
  <button id="startBtn">⚔ NOVO JOGO</button>
</div>

<div id="gameWrap">
  <canvas id="gameCanvas"></canvas>
  <div id="dpad">
    <div></div><div class="dp" data-dir="up">▲</div><div></div>
    <div class="dp" data-dir="left">◄</div>
    <div class="dp" data-dir="attack" style="font-size:75%">⚔</div>
    <div class="dp" data-dir="right">►</div>
    <div></div><div class="dp" data-dir="down">▼</div><div></div>
  </div>
  <div id="actionBtns">
    <button class="abtn" id="btnHp">❤<br>HP</button>
    <button class="abtn" id="btnMp">✦<br>MP</button>
    <button class="abtn" id="btnInv">🎒<br>INV</button>
    <button class="abtn" id="btnSave">💾<br>SAL</button>
    <button class="abtn" id="btnMute">🔊<br>SOM</button>
  </div>
  <div id="spellBar"></div>
</div>

<div id="shopModal">
  <div id="shopBox">
    <h2 id="shopTitle">LOJA</h2>
    <div id="shopTabs">
      <button class="stab" id="tabBuy"  onclick="shopTab('buy')">⚔ COMPRAR</button>
      <button class="stab" id="tabSell" onclick="shopTab('sell')">💰 VENDER</button>
    </div>
    <div class="shop-gold" id="shopGold"></div>
    <div id="shopContent"></div>
    <button id="shopClose" onclick="closeShop()">FECHAR</button>
  </div>
</div>

<div id="deathModal">
  <div id="deathBox">
    <h2>VOCÊ MORREU</h2>
    <div class="death-sub">Sua jornada terminou... por enquanto.</div>
    <div class="death-info">
      <div class="di-row"><span class="di-label">Nível</span><span class="di-val" id="dInfoLvl">—</span></div>
      <div class="di-row"><span class="di-label">Gold perdido</span><span class="di-penalty" id="dInfoLost">—</span></div>
      <div class="di-row"><span class="di-label">Gold restante</span><span class="di-val" id="dInfoGold">—</span></div>
    </div>
    <div class="death-town" id="dInfoTown">Renascendo em...</div>
    <button id="btnRespawn" onclick="world.respawn()">⚔ RENASCER NA CIDADE</button>
  </div>
</div>

<div id="invModal">
  <div id="invBox">
    <h2 id="invTitle">INVENTÁRIO</h2>
    <div id="invContent"></div>
    <button id="invClose">FECHAR</button>
  </div>
</div>

// ═══ A* PATHFINDING ═══
function aStar(passable, sx, sy, gx, gy, maxSteps=200) {
  if (sx===gx && sy===gy) return [];
  if (!passable(gx,gy)) {
    let found=false;
    outer: for(let r=1;r<4;r++) for(let dy=-r;dy<=r;dy++) for(let dx=-r;dx<=r;dx++) {
      if(passable(gx+dx,gy+dy)){gx+=dx;gy+=dy;found=true;break outer;}
    }
    if(!found) return [];
  }
  const open=[],g={},from={};
  const key=(x,y)=>x*1000+y;
  const heur=(x,y)=>Math.abs(x-gx)+Math.abs(y-gy);
  open.push([heur(sx,sy),sx,sy]);
  g[key(sx,sy)]=0;
  while(open.length && Object.keys(g).length<maxSteps){
    open.sort((a,b)=>a[0]-b[0]);
    const[,cx,cy]=open.shift();
    if(cx===gx&&cy===gy){
      const path=[];let cur=key(gx,gy);
      while(from[cur]){const[px,py]=from[cur];path.unshift([px,py]);cur=key(px,py);}
      path.push([gx,gy]);return path.slice(1);
    }
    for(const[dx,dy] of [[-1,0],[1,0],[0,-1],[0,1]]){
      const nx=cx+dx,ny=cy+dy;
      if(!passable(nx,ny)) continue;
      const ng=(g[key(cx,cy)]||0)+1;
      if(ng<(g[key(nx,ny)]??999999)){
        g[key(nx,ny)]=ng;from[key(nx,ny)]=[cx,cy];
        open.push([ng+heur(nx,ny),nx,ny]);
      }
    }
  }
  return [];
}

// ═══ MAP ═══
class WorldMap {
  constructor(){
    this.data=Array.from({length:MAP_H},()=>Array(MAP_W).fill('G'));
    this._gen();
  }
  get(x,y){if(x<0||y<0||x>=MAP_W||y>=MAP_H)return 'M';return this.data[y][x];}
  set(x,y,t){if(x>0&&y>0&&x<MAP_W-1&&y<MAP_H-1)this.data[y][x]=t;}
  passable(x,y){return TILE_DEF[this.get(x,y)]?.[2]??false;}
  revealed=new Uint8Array(MAP_W*MAP_H);
  reveal(x,y,r=6){
    for(let dy=-r;dy<=r;dy++)for(let dx=-r;dx<=r;dx++){
      if(dx*dx+dy*dy<=r*r){const ix=x+dx,iy=y+dy;if(ix>=0&&iy>=0&&ix<MAP_W&&iy<MAP_H)this.revealed[iy*MAP_W+ix]=1;}
    }
  }
  _gen(){
    const r=(a,b)=>Math.floor(Math.random()*(b-a))+a;
    for(let x=0;x<MAP_W;x++){this.set(x,0,'M');this.set(x,MAP_H-1,'M');}
    for(let y=0;y<MAP_H;y++){this.set(0,y,'M');this.set(MAP_W-1,y,'M');}
    let rx=r(MAP_W/4,3*MAP_W/4);
    for(let y=1;y<MAP_H-1;y++){
      for(let dx=-2;dx<=2;dx++)this.set(rx+dx,y,'W');
      rx+=r(-1,2);rx=Math.max(5,Math.min(MAP_W-6,rx));
    }
    for(let i=0;i<18;i++){
      let cx=r(10,MAP_W-10),cy=r(10,MAP_H-10),rad=r(4,12);
      for(let dy=-rad;dy<=rad;dy++)for(let dx=-rad;dx<=rad;dx++)
        if(dx*dx+dy*dy<=rad*rad&&Math.random()<.65&&this.get(cx+dx,cy+dy)==='G')
          this.set(cx+dx,cy+dy,'T');
    }
    for(let i=0;i<5;i++){
      let cx=r(20,MAP_W-20),cy=r(20,MAP_H-20);
      for(let s=0;s<r(8,22);s++){
        for(let dy=-3;dy<=3;dy++)for(let dx=-3;dx<=3;dx++)
          if(Math.random()<.55)this.set(cx+dx,cy+dy,'M');
        cx+=r(-2,3);cy+=r(-2,3);
      }
    }
    this._town(30,30);this._town(90,30);this._town(60,90);
    this._dungeonEntrance(60,60);this._dungeonEntrance(35,85);this._dungeonEntrance(100,100);
  }
  _town(cx,cy){
    const s=10,r=(a,b)=>Math.floor(Math.random()*(b-a))+a;
    for(let dy=-s;dy<=s;dy++)for(let dx=-s;dx<=s;dx++)this.set(cx+dx,cy+dy,'S');
    for(let dx=-(s+1);dx<=s+1;dx++){this.set(cx+dx,cy-s-1,'X');this.set(cx+dx,cy+s+1,'X');}
    for(let dy=-(s+1);dy<=s+1;dy++){this.set(cx-s-1,cy+dy,'X');this.set(cx+s+1,cy+dy,'X');}
    for(let d=-1;d<=1;d++){
      this.set(cx+d,cy-s-1,'D');this.set(cx+d,cy+s+1,'D');
      this.set(cx-s-1,cy+d,'D');this.set(cx+s+1,cy+d,'D');
    }
    for(let i=0;i<5;i++){
      let bx=cx+r(-s+3,s-3),by=cy+r(-s+3,s-3),bw=r(3,6),bh=r(3,5);
      for(let dy=0;dy<=bh;dy++)for(let dx=0;dx<=bw;dx++)
        this.set(bx+dx,by+dy,(dx===0||dy===0||dx===bw||dy===bh)?'X':'S');
      this.set(bx+Math.floor(bw/2),by+bh,'S');
    }
  }
  _dungeonEntrance(cx,cy){
    // Dark atmospheric area around the entrance
    const s=9;
    for(let dy=-s;dy<=s;dy++)for(let dx=-s;dx<=s;dx++)
      if(dx*dx+dy*dy<=s*s*0.85)this.set(cx+dx,cy+dy,'F');
    // Crumbling stone walls for atmosphere
    for(let i=0;i<8;i++){
      const wx=cx+Math.floor(Math.cos(i*0.8)*6),wy=cy+Math.floor(Math.sin(i*0.8)*6);
      this.set(wx,wy,'X');this.set(wx+1,wy,'X');
    }
    // The hole (impassable walls on each side)
    this.set(cx-1,cy,'X');this.set(cx+1,cy,'X');
    this.set(cx,cy,'H');
  }
}

// ═══ SOUND ENGINE (Web Audio API — no external files) ═══
class SoundEngine {
  constructor(){
    try{ this.ctx=new(window.AudioContext||window.webkitAudioContext)(); }
    catch(e){ this.ctx=null; }
    this.muted=false;
    this._lastStep=0;
  }
  _resume(){ if(this.ctx?.state==='suspended')this.ctx.resume(); }
  // Master gain + connect to destination
  _bus(vol){
    if(!this.ctx||this.muted)return null;
    this._resume();
    const g=this.ctx.createGain(); g.gain.value=vol;
    g.connect(this.ctx.destination); return g;
  }
  // Single oscillator with optional frequency ramp
  _osc(type,freq,dur,vol=0.25,freqEnd=null,delay=0){
    const bus=this._bus(vol); if(!bus)return;
    const t=this.ctx.currentTime+delay;
    const o=this.ctx.createOscillator(); o.type=type;
    o.frequency.setValueAtTime(freq,t);
    if(freqEnd)o.frequency.exponentialRampToValueAtTime(freqEnd,t+dur);
    bus.gain.setValueAtTime(vol,t);
    bus.gain.exponentialRampToValueAtTime(0.001,t+dur);
    o.connect(bus); o.start(t); o.stop(t+dur+0.01);
  }
  // White noise burst through bandpass
  _noise(dur,vol=0.12,freq=500){
    const bus=this._bus(vol); if(!bus)return;
    const t=this.ctx.currentTime;
    const n=this.ctx.sampleRate*dur;
    const buf=this.ctx.createBuffer(1,n,this.ctx.sampleRate);
    const d=buf.getChannelData(0);
    for(let i=0;i<n;i++)d[i]=(Math.random()*2-1)*(1-i/n);
    const src=this.ctx.createBufferSource(); src.buffer=buf;
    const bp=this.ctx.createBiquadFilter(); bp.type='bandpass';
    bp.frequency.value=freq; bp.Q.value=1;
    src.connect(bp); bp.connect(bus); src.start(t);
  }
  // ── Sounds ───────────────────────────────────────────
  step(){
    const now=Date.now(); if(now-this._lastStep<80)return; this._lastStep=now;
    this._noise(0.035,0.05,300);
  }
  swing(){ this._osc('sawtooth',380,0.12,0.18,70); }
  hit(){   this._osc('square',  200,0.08,0.28,55); }         // player takes damage
  monsterHit(){ this._osc('sawtooth',150,0.07,0.14,50); }
  monsterDie(){
    this._osc('square',110,0.22,0.18,35);
    setTimeout(()=>this._noise(0.1,0.1,200),60);
  }
  levelUp(){
    [523,659,784,1047].forEach((f,i)=>this._osc('sine',f,0.28,0.28,null,i*0.11));
  }
  coin(){ this._osc('triangle',1500,0.14,0.22,750); }
  potion(){
    this._osc('sine',700,0.18,0.2,1400);
    this._osc('sine',900,0.12,0.14,1400,0.06);
  }
  equip(){
    this._osc('triangle',350,0.08,0.22);
    this._osc('triangle',500,0.08,0.18,null,0.09);
  }
  spellRanged(){ this._osc('sine',900,0.14,0.22,250); }
  spellArea(){
    this._osc('sawtooth',220,0.28,0.28,50);
    setTimeout(()=>this._noise(0.18,0.18,250),40);
  }
  spellHeal(){
    [380,560,750].forEach((f,i)=>this._osc('sine',f,0.3,0.22,null,i*0.09));
  }
  spellBuff(){
    [280,420,600,840].forEach((f,i)=>this._osc('triangle',f,0.14,0.2,null,i*0.07));
  }
  spellMelee(){ this._osc('sawtooth',430,0.1,0.28,90); }
  spellLine(){
    this._osc('sine',1100,0.18,0.22,400);
    this._osc('sawtooth',600,0.1,0.14,200,0.04);
  }
  death(){
    [420,310,220,160].forEach((f,i)=>this._osc('sine',f,0.38,0.28,null,i*0.19));
  }
  respawn(){
    [300,420,600,840,1080].forEach((f,i)=>this._osc('sine',f,0.28,0.22,null,i*0.11));
  }
  dungeonEnter(){
    this._osc('sawtooth',140,0.55,0.28,55);
    setTimeout(()=>this._noise(0.25,0.18,150),110);
  }
  dungeonExit(){ this._osc('sine',350,0.55,0.32,900); }
  shop(){
    this.coin();
    this._osc('triangle',1100,0.1,0.14,600,0.12);
  }
  save(){
    [750,950,1150].forEach((f,i)=>this._osc('triangle',f,0.14,0.16,null,i*0.09));
  }
  toggleMute(){ this.muted=!this.muted; return this.muted; }
}

  }
  get(x,y){if(x<0||y<0||x>=MAP_W||y>=MAP_H)return'V';return this.data[y][x];}
  set(x,y,t){if(x>=0&&y>=0&&x<MAP_W&&y<MAP_H)this.data[y][x]=t;}
  passable(x,y){return TILE_DEF[this.get(x,y)]?.[2]??false;}
  reveal(x,y,r=6){
    for(let dy=-r;dy<=r;dy++)for(let dx=-r;dx<=r;dx++){
      if(dx*dx+dy*dy<=r*r){const ix=x+dx,iy=y+dy;if(ix>=0&&iy>=0&&ix<MAP_W&&iy<MAP_H)this.revealed[iy*MAP_W+ix]=1;}
    }
  }
  _gen(){
    const ri=(a,b)=>Math.floor(Math.random()*(b-a+1))+a;
    const pad=20,aW=MAP_W-pad*2,aH=MAP_H-pad*2;
    const numRm=9+this.difficulty*3,minRm=6,maxRm=13;
    // Carve rooms
    for(let att=0;att<400&&this.rooms.length<numRm;att++){
      const rw=ri(minRm,maxRm),rh=ri(minRm-2,maxRm-3);
      const rx=pad+ri(0,aW-rw-1),ry=pad+ri(0,aH-rh-1);
      if(this.rooms.some(rm=>rx<rm.x+rm.w+3&&rx+rw+3>rm.x&&ry<rm.y+rm.h+3&&ry+rh+3>rm.y))continue;
      this.rooms.push({x:rx,y:ry,w:rw,h:rh,cx:rx+(rw>>1),cy:ry+(rh>>1)});
      for(let dy=0;dy<=rh;dy++)for(let dx=0;dx<=rw;dx++){
        if(dx===0||dy===0||dx===rw||dy===rh)this.set(rx+dx,ry+dy,'X');
        else this.set(rx+dx,ry+dy,'F');
      }
    }
    if(!this.rooms.length)return;
    // Connect rooms (MST: always link nearest unconnected)
    const conn=new Set([0]);
    while(conn.size<this.rooms.length){
      let best=Infinity,bF=-1,bT=-1;
      for(const fi of conn){
        const a=this.rooms[fi];
        for(let ti=0;ti<this.rooms.length;ti++){
          if(conn.has(ti))continue;
          const b=this.rooms[ti];
          const dist=Math.abs(a.cx-b.cx)+Math.abs(a.cy-b.cy);
          if(dist<best){best=dist;bF=fi;bT=ti;}
        }
      }
      if(bT<0)break;
      conn.add(bT);
      const a=this.rooms[bF],b=this.rooms[bT];
      // L-shaped corridor (2 wide for easier navigation)
      if(Math.random()<.5){
        for(let x=Math.min(a.cx,b.cx);x<=Math.max(a.cx,b.cx);x++){this.set(x,a.cy,'F');this.set(x,a.cy+1,'F');}
        for(let y=Math.min(a.cy,b.cy);y<=Math.max(a.cy,b.cy);y++){this.set(b.cx,y,'F');this.set(b.cx+1,y,'F');}
      }else{
        for(let y=Math.min(a.cy,b.cy);y<=Math.max(a.cy,b.cy);y++){this.set(a.cx,y,'F');this.set(a.cx+1,y,'F');}
        for(let x=Math.min(a.cx,b.cx);x<=Math.max(a.cx,b.cx);x++){this.set(x,b.cy,'F');this.set(x,b.cy+1,'F');}
      }
    }
    // Stairs up in first room; player entry 2 tiles below stairs
    const fr=this.rooms[0];
    this.stairsX=fr.cx;this.stairsY=fr.cy;
    this.set(this.stairsX,this.stairsY,'U');
    this.entryX=fr.cx;this.entryY=Math.min(fr.y+fr.h-1,fr.cy+2);
    this.set(this.entryX,this.entryY,'F');
  }
}

// ═══ ENTITIES ═══
let _eid=0;
class Entity {
  constructor(x,y,name,maxHp,maxMp,atk,def,spd){
    this.id=++_eid;this.x=x;this.y=y;this.name=name;
    this.maxHp=maxHp;this.hp=maxHp;
    this.maxMp=maxMp||0;this.mp=this.maxMp;
    this.atk=atk||10;this.def=def||5;this.spd=spd||4;
    this.alive=true;this.moveCd=0;this.atkCd=0;
    this.flashTick=0;
  }
  damage(dmg){
    const mit=Math.max(1,dmg-Math.floor(this.def/2));
    this.hp=Math.max(0,this.hp-mit);
    this.flashTick=8;
    if(this.hp===0)this.alive=false;
    return mit;
  }
  heal(v){this.hp=Math.min(this.maxHp,this.hp+v);}
  restoreMp(v){this.mp=Math.min(this.maxMp,this.mp+v);}
}

const EQ_SLOTS = ['weapon','armor','helmet','legs','boots','shield','ring','amulet'];

class Player extends Entity {
  constructor(x,y,name,voc){
    const v=VOCATIONS[voc];
    super(x,y,name,150,50,15,10,4);
    this.voc=voc;this.vocData=v;
    this.level=1;this.xp=0;this.gold=200;
    this.inv={};
    this.eq={weapon:null,armor:null,helmet:null,legs:null,boots:null,shield:null,ring:null,amulet:null};
    this.spellCds={};
    this.atkBuff={val:1,ttl:0};
    // starting gear
    [1,8,11,51,55].forEach(id=>{this.addItem(id);this.equip(id);});
    for(let i=0;i<5;i++)this.addItem(20);
    for(let i=0;i<3;i++)this.addItem(22);
    // visual animation fields (pixel center)
    this.px=x*32+16; this.py=y*32+16;
  }
  get totalAtk(){
    const eq=this.eq;
    const weapAtk=(eq.weapon&&ITEMS[eq.weapon])?ITEMS[eq.weapon].atk:0;
    const ringAtk=(eq.ring&&ITEMS[eq.ring])?ITEMS[eq.ring].atk:0;
    const amuAtk=(eq.amulet&&ITEMS[eq.amulet])?ITEMS[eq.amulet].atk:0;
    return Math.floor((this.atk+weapAtk+ringAtk+amuAtk)*this.atkBuff.val);
  }
  get totalDef(){
    return this.def+['armor','shield','helmet','legs','boots','ring','amulet']
      .reduce((s,sl)=>s+((this.eq[sl]&&ITEMS[this.eq[sl]])?ITEMS[this.eq[sl]].def:0),0);
  }
  get xpNext(){return this.level*this.level*100;}
  addItem(id,n=1){
    const it=ITEMS[id];if(!it)return;
    if(it.t==='gold'){this.gold+=n*it.val;return;}
    this.inv[id]=(this.inv[id]||0)+n;
  }
  removeItem(id,n=1){
    if((this.inv[id]||0)<n)return false;
    this.inv[id]-=n;if(this.inv[id]===0)delete this.inv[id];return true;
  }
  equip(id){
    const it=ITEMS[id];if(!it||this.level<it.lvl)return false;
    const slot=it.t;if(!EQ_SLOTS.includes(slot))return false;
    this.eq[slot]=id;return true;
  }
  useConsumable(id){
    const it=ITEMS[id];if(!it||!['potion','food'].includes(it.t))return false;
    if(!this.removeItem(id))return false;
    if(it.hp)this.heal(it.hp);
    if(it.mp)this.restoreMp(it.mp);
    sfx.potion();
    return true;
  }
  gainXp(v){
    this.xp+=v;let leveled=false;
    while(this.xp>=this.xpNext){
      this.xp-=this.xpNext;this.level++;
      const v=this.vocData;
      this.maxHp+=v.hp;this.maxMp+=v.mp;this.atk+=v.atk;this.def+=v.def;
      this.hp=this.maxHp;this.mp=this.maxMp;leveled=true;
    }
    return leveled;
  }
}

class Monster extends Entity {
  constructor(x,y,idx){
    const[name,color,hp,atk,def,spd,xp,aggro,loot,minLvl]=MONSTERS[idx];
    super(x,y,name,hp,0,atk,def,spd);
    this.color=color;this.xpReward=xp;this.aggroRange=aggro;
    this.lootTable=loot;this.minLevel=minLvl;
    this.spawnX=x;this.spawnY=y;
    this.path=[];this.pathAge=0;
    this.wanderCd=Math.floor(Math.random()*20);
    this.monIdx=idx;
  }
  dropLoot(){return this.lootTable.filter(([,c])=>Math.random()<c).map(([id])=>id);}
}

// ═══ NPC ═══
class NPC extends Entity {
  constructor(def){
    const v=VOCATIONS[def.voc]||VOCATIONS.Knight;
    const lvl=def.lvl;
    super(def.x,def.y,def.name,
      100+lvl*v.hp*2, 50+lvl*v.mp,
      8+lvl*v.atk*1.5|0, 4+lvl*v.def, 5);
    this.voc=def.voc; this.level=lvl;
    this.role=def.role; this.title=def.title||'NPC';
    this.dialogue=def.dlg; this.stock=def.stock||[];
    this.defId=def.id;
    this.spawnX=def.x; this.spawnY=def.y;
    this.wanderRadius=def.role==='merchant'?3:10;
    this.talkCd=Math.floor(Math.random()*200);
    this.moveCd=Math.floor(Math.random()*40);
    this.atkCd=0;
    this.path=[]; this.pathAge=0;
  }
}

// ═══ WORLD ═══
class World {
  constructor(player){
    this.player=player;
    this.map=new WorldMap();
    this.monsters=[];
    this.chat=[];
    this.floats=[];
    this.events=[];  // {t, x, y} for particle effects
    this.projectiles=[]; // visual only: {sx,sy,tx,ty,progress,speed,color}
    this.tick=0;
    this.regenTick=0;
    this.spawnedZones=new Set();
    this.currentFloor=0;
    this.dungeons={};
    this._surfaceMap=null;this._surfaceMonsters=null;
    this._surfacePx=30;this._surfacePy=30;
    this._preMoveX=30;this._preMoveY=30;
    this._deathShown=false;
    this.npcs=NPC_DEFS.map(d=>new NPC(d));
    player.x=30;player.y=30;
    this._fixPos(player);
    this.npcs.forEach(n=>this._fixPos(n));
    this.map.reveal(player.x,player.y,12);
    this._spawnZone(player.x,player.y,8,20);
    this.log('Bem-vindo! Mova com o D-pad. Toque em monstros para atacar.','#FFD700');
  }
  _fixPos(e){
    if(!this.map.passable(e.x,e.y))
      for(let r=1;r<10;r++)for(let dy=-r;dy<=r;dy++)for(let dx=-r;dx<=r;dx++)
        if(this.map.passable(e.x+dx,e.y+dy)){e.x+=dx;e.y+=dy;return;}
  }
  log(msg,color='#FFFFFF'){
    this.chat.push({msg,color,ts:Date.now()});
    if(this.chat.length>60)this.chat.shift();
  }
  float(text,x,y,color){
    this.floats.push({text,x,y:y*TILE,color,ttl:55,dy:-0.9});
  }
  update(){
    this.tick++;this.regenTick++;
    const p=this.player;
    if(!p.alive)return;
    this.map.reveal(p.x,p.y);
    if(this.currentFloor===0){
      const zk=`${Math.floor(p.x/20)}_${Math.floor(p.y/20)}`;
      if(!this.spawnedZones.has(zk)){this.spawnedZones.add(zk);this._spawnZone(p.x,p.y,8,22);}
    }
    const dead=this.monsters.filter(m=>!m.alive);
    dead.forEach(m=>{
      const drops=m.dropLoot();
      drops.forEach(id=>p.addItem(id));
      if(drops.length)this.log(`${m.name} largou: ${drops.map(id=>ITEMS[id]?.n||'?').join(', ')}`,'#FFD700');
      if(drops.some(id=>ITEMS[id]?.t==='gold'||ITEMS[id]?.t==='loot'))sfx.coin();
      const leveled=p.gainXp(m.xpReward);
      this.log(`+${m.xpReward} XP de ${m.name}.`,'#00CC00');
      if(leveled){this.log(`>>> LEVEL UP! Você é nível ${p.level}! <<<`,'#FFD700');sfx.levelUp();setTimeout(saveGame,100);}
    });
    this.monsters=this.monsters.filter(m=>m.alive);
    this._updateAI();
    if(this.regenTick>=90){
      this.regenTick=0;
      p.restoreMp(Math.max(1,Math.floor(p.maxMp/20)));
      const near=this.monsters.some(m=>Math.max(Math.abs(m.x-p.x),Math.abs(m.y-p.y))<=4);
      if(!near)p.heal(Math.max(1,Math.floor(p.maxHp/30)));
    }
    this.floats.forEach(f=>{f.ttl--;f.y+=f.dy;});
    this.floats=this.floats.filter(f=>f.ttl>0);
    if(this.currentFloor===0)this._updateNPCs();
    this.monsters.forEach(m=>{if(m.flashTick>0)m.flashTick--;});
    if(p.flashTick>0)p.flashTick--;
    // Spell cooldowns & buff
    for(const id in p.spellCds) if(p.spellCds[id]>0) p.spellCds[id]--;
    if(p.atkBuff.ttl>0){p.atkBuff.ttl--;if(p.atkBuff.ttl===0)p.atkBuff.val=1;}
    // Projectiles
    this.projectiles.forEach(pr=>{pr.progress+=pr.speed;});
    this.projectiles=this.projectiles.filter(pr=>pr.progress<1);
  }
  _updateAI(){
    const p=this.player;
    const passable=(x,y)=>this.map.passable(x,y)&&!this.monsters.some(m=>m.x===x&&m.y===y&&m.alive);
    for(const m of this.monsters){
      m.moveCd=Math.max(0,m.moveCd-1);m.atkCd=Math.max(0,m.atkCd-1);
      const dist=Math.max(Math.abs(m.x-p.x),Math.abs(m.y-p.y));
      if(dist<=m.aggroRange){
        if(dist<=1&&m.atkCd===0){
          m.atkCd=Math.max(1,10-Math.floor(m.spd/2));
          const dmg=Math.max(1,m.atk+Math.floor(Math.random()*7)-3);
          const actual=p.damage(dmg);
          this.float(`-${actual}`,p.x,p.y,'#FF4444');
          this.events.push({t:'blood',x:p.x,y:p.y});
          sfx.hit();
          if(!p.alive)this._onDeath();
        } else if(dist>1&&m.moveCd===0){
          m.moveCd=Math.max(1,8-Math.floor(m.spd/2));
          this._moveToward(m,p.x,p.y,passable);
        }
      } else {
        m.wanderCd--;
        if(m.wanderCd<=0&&m.moveCd===0){
          m.wanderCd=10+Math.floor(Math.random()*20);
          m.moveCd=Math.max(1,8-Math.floor(m.spd/2));
          const dirs=[[-1,0],[1,0],[0,-1],[0,1]];
          const[dx,dy]=dirs[Math.floor(Math.random()*4)];
          const nx=m.x+dx,ny=m.y+dy;
          if(this.map.passable(nx,ny)&&Math.max(Math.abs(nx-m.spawnX),Math.abs(ny-m.spawnY))<=8)
            [m.x,m.y]=[nx,ny];
        }
      }
    }
  }
  _moveToward(m,tx,ty,passable){
    m.pathAge++;
    if(m.pathAge>5||m.path.length===0){
      m.path=aStar(this.map.passable.bind(this.map),m.x,m.y,tx,ty);
      m.pathAge=0;
    }
    if(m.path.length){
      const[nx,ny]=m.path[0];
      if(passable(nx,ny)){m.x=nx;m.y=ny;m.path.shift();}
      else m.path=[];
    }
  }
  attackNearest(){
    const p=this.player;
    const adj=this.monsters.filter(m=>m.alive&&Math.max(Math.abs(m.x-p.x),Math.abs(m.y-p.y))<=1);
    if(!adj.length){this.log('Nenhum inimigo adjacente!','#AAAAAA');return;}
    this._playerHit(adj.reduce((a,b)=>a.hp<b.hp?a:b));
  }
  attackMonster(m){
    if(!m||!m.alive)return;
    const dist=Math.max(Math.abs(m.x-this.player.x),Math.abs(m.y-this.player.y));
    if(dist>1){this.log(`Chegue perto de ${m.name} para atacar!`,'#FF8800');return;}
    this._playerHit(m);
  }
  _playerHit(target){
    const p=this.player;
    if(Math.random()<.05){this.log('Você errou!','#888888');return;}
    const crit=Math.random()<.10;
    const base=p.totalAtk+Math.floor(Math.random()*7)-3;
    const dmg=crit?base*2:base;
    sfx.swing();
    const actual=target.damage(dmg);
    this.log(`${crit?'CRÍTICO! ':''}Você causa ${actual} em ${target.name}.`,crit?'#FFD700':'#FFFFFF');
    this.float(`-${actual}`,target.x,target.y,crit?'#FFD700':'#FF4444');
    this.events.push({t:crit?'crit':'blood',x:target.x,y:target.y});
    if(!target.alive){this.log(`Você matou ${target.name}!`,'#00FF00');sfx.monsterDie();}
    else sfx.monsterHit();
  }
  useHpPotion(){
    const p=this.player;
    for(const id of[71,69,21,20]){
      if(p.inv[id]){const old=p.hp;p.useConsumable(id);this.log(`Você usa ${ITEMS[id].n} e recupera ${p.hp-old} HP.`,'#CC0000');return;}
    }
    this.log('Sem poções de HP!','#FF0000');
  }
  useMpPotion(){
    const p=this.player;
    for(const id of[72,70,23,22]){
      if(p.inv[id]){const old=p.mp;p.useConsumable(id);this.log(`Você usa ${ITEMS[id].n} e recupera ${p.mp-old} MP.`,'#0044CC');return;}
    }
    this.log('Sem poções de MP!','#0000FF');
  }
  castSpell(idx){
    const p=this.player; if(!p.alive) return;
    const avail=(SPELLS[p.voc]||[]).filter(s=>p.level>=s.lvl);
    const spell=avail[idx]; if(!spell) return;
    if((p.spellCds[spell.id]||0)>0){
      this.log(`${spell.name} em recarga (${p.spellCds[spell.id]} ticks)!`,'#888888'); return;
    }
    if(p.mp<spell.mp){this.log(`MP insuficiente para ${spell.name}!`,'#4444FF'); return;}
    p.mp-=spell.mp;
    p.spellCds[spell.id]=spell.cd;
    const spellSfx={melee:'spellMelee',area_melee:'spellArea',ranged:'spellRanged',
      area_ranged:'spellArea',line:'spellLine',heal:'spellHeal',buff:'spellBuff',all_ranged:'spellArea'};
    sfx[spellSfx[spell.t]||'spellRanged']?.();
    switch(spell.t){
      case 'melee':       this._sMelee(spell);      break;
      case 'area_melee':  this._sAreaMelee(spell);  break;
      case 'ranged':      this._sRanged(spell);     break;
      case 'area_ranged': this._sAreaRanged(spell); break;
      case 'line':        this._sLine(spell);       break;
      case 'heal':        this._sHeal(spell);       break;
      case 'buff':        this._sBuff(spell);       break;
      case 'all_ranged':  this._sAllRanged(spell);  break;
    }
  }
  _nearestIn(range){
    const p=this.player;
    return this.monsters
      .filter(m=>m.alive&&Math.max(Math.abs(m.x-p.x),Math.abs(m.y-p.y))<=range)
      .sort((a,b)=>Math.max(Math.abs(a.x-p.x),Math.abs(a.y-p.y))-Math.max(Math.abs(b.x-p.x),Math.abs(b.y-p.y)))[0]||null;
  }
  _spellDmg(target,spell){
    const p=this.player;
    const base=Math.floor(p.totalAtk*spell.val);
    const actual=target.damage(base);
    this.float(`-${actual}`,target.x,target.y,spell.color);
    this.events.push({t:'crit',x:target.x,y:target.y});
    if(!target.alive)this.log(`Você matou ${target.name}!`,'#00FF00');
    return actual;
  }
  _addProj(tx,ty,spell){
    const p=this.player;
    this.projectiles.push({sx:p.x,sy:p.y,tx,ty,progress:0,speed:0.18,color:spell.color});
  }
  _sMelee(spell){
    const t=this._nearestIn(1);
    if(!t){this.log('Nenhum inimigo adjacente!','#888');return;}
    const actual=this._spellDmg(t,spell);
    this.log(`${spell.name}: ${actual} de dano em ${t.name}!`,spell.color);
  }
  _sAreaMelee(spell){
    const p=this.player;
    const targets=this.monsters.filter(m=>m.alive&&Math.max(Math.abs(m.x-p.x),Math.abs(m.y-p.y))<=spell.range);
    if(!targets.length){this.log('Nenhum inimigo no alcance!','#888');return;}
    let total=0; targets.forEach(t=>{total+=this._spellDmg(t,spell);});
    this.log(`${spell.name}: ${total} de dano total em ${targets.length} inimigo(s)!`,spell.color);
  }
  _sRanged(spell){
    const t=this._nearestIn(spell.range);
    if(!t){this.log(`Nenhum inimigo em alcance ${spell.range}!`,'#888');return;}
    this._addProj(t.x,t.y,spell);
    const actual=this._spellDmg(t,spell);
    this.log(`${spell.name}: ${actual} de dano em ${t.name}!`,spell.color);
  }
  _sAreaRanged(spell){
    const center=this._nearestIn(spell.range);
    if(!center){this.log(`Nenhum inimigo em alcance ${spell.range}!`,'#888');return;}
    this._addProj(center.x,center.y,spell);
    const ar=spell.areaR||1;
    const targets=this.monsters.filter(m=>m.alive&&Math.max(Math.abs(m.x-center.x),Math.abs(m.y-center.y))<=ar);
    let total=0; targets.forEach(t=>{total+=this._spellDmg(t,spell);});
    this.log(`${spell.name}: ${total} de dano em ${targets.length} inimigo(s)!`,spell.color);
  }
  _sLine(spell){
    const p=this.player;
    const t=this._nearestIn(spell.range);
    if(!t){this.log('Nenhum inimigo no alcance!','#888');return;}
    this._addProj(t.x,t.y,spell);
    const dx=Math.sign(t.x-p.x), dy=Math.sign(t.y-p.y);
    const targets=this.monsters.filter(m=>{
      if(!m.alive) return false;
      const ex=m.x-p.x, ey=m.y-p.y;
      if(Math.max(Math.abs(ex),Math.abs(ey))>spell.range) return false;
      return (ex*dx+ey*dy)>0 && Math.abs(ex*dy-ey*dx)<=1;
    });
    let total=0; targets.forEach(t2=>{total+=this._spellDmg(t2,spell);});
    this.log(`${spell.name}: ${total} de dano em ${targets.length} inimigo(s)!`,spell.color);
  }
  _sHeal(spell){
    const old=this.player.hp;
    this.player.heal(spell.val);
    const got=this.player.hp-old;
    this.float(`+${got}`,this.player.x,this.player.y,spell.color);
    this.events.push({t:'heal',x:this.player.x,y:this.player.y,color:spell.color});
    this.log(`${spell.name}: recuperou ${got} HP!`,spell.color);
  }
  _sBuff(spell){
    this.player.atkBuff={val:spell.val,ttl:spell.dur};
    this.events.push({t:'crit',x:this.player.x,y:this.player.y});
    this.log(`${spell.name}: ATK ×${spell.val} por ${(spell.dur/30).toFixed(0)}s!`,spell.color);
  }
  _sAllRanged(spell){
    const p=this.player;
    const targets=this.monsters.filter(m=>m.alive&&Math.max(Math.abs(m.x-p.x),Math.abs(m.y-p.y))<=spell.range);
    if(!targets.length){this.log('Nenhum inimigo visível!','#888');return;}
    targets.forEach(t=>{this._addProj(t.x,t.y,spell);this._spellDmg(t,spell);});
    this.log(`${spell.name}: atingiu ${targets.length} inimigo(s)!`,spell.color);
  }
  _onDeath(){
    if(this._deathShown)return;
    this._deathShown=true;
    sfx.death();
    this.log('Você foi morto!','#FF0000');
    const p=this.player;
    const lost=Math.floor(p.gold*0.1);
    // Find nearest town to last surface position
    const sx=this._surfacePx||30,sy=this._surfacePy||30;
    let town=TOWN_SPAWNS[0],bd=Infinity;
    for(const t of TOWN_SPAWNS){
      const d=Math.abs(t.x-sx)+Math.abs(t.y-sy);
      if(d<bd){bd=d;town=t;}
    }
    setTimeout(()=>{
      document.getElementById('dInfoLvl').textContent=`${p.level}`;
      document.getElementById('dInfoLost').textContent=`-${lost} gold`;
      document.getElementById('dInfoGold').textContent=`${Math.max(0,p.gold-lost)} gold`;
      document.getElementById('dInfoTown').textContent=`Renascendo em ${town.name}`;
      document.getElementById('deathModal').classList.add('show');
    },1400);
  }
  respawn(){
    const p=this.player;
    // Exit dungeon if underground
    if(this.currentFloor>0)this.exitDungeon();
    // Find nearest town to surface death position
    const sx=this._surfacePx||30,sy=this._surfacePy||30;
    let town=TOWN_SPAWNS[0],bd=Infinity;
    for(const t of TOWN_SPAWNS){
      const d=Math.abs(t.x-sx)+Math.abs(t.y-sy);
      if(d<bd){bd=d;town=t;}
    }
    const lost=Math.floor(p.gold*0.1);
    p.gold=Math.max(0,p.gold-lost);
    p.hp=Math.max(1,Math.floor(p.maxHp*0.3));
    p.mp=Math.max(0,Math.floor(p.maxMp*0.3));
    p.alive=true;
    p.atkBuff={val:1,ttl:0};
    p.x=town.x;p.y=town.y;
    this._fixPos(p);
    this.map.reveal(p.x,p.y,10);
    this._deathShown=false;
    document.getElementById('deathModal').classList.remove('show');
    sfx.respawn();
    this.log(`Renasceu em ${town.name}. Perdeu ${lost} gold.`,'#FF8800');
    setTimeout(saveGame,200);
  }
  _updateNPCs(){
    const p=this.player;
    for(const npc of this.npcs){
      if(!npc.alive)continue;
      // Slow HP regen
      if(this.tick%90===0&&npc.hp<npc.maxHp)npc.hp=Math.min(npc.maxHp,npc.hp+Math.ceil(npc.maxHp*.04));
      // Talk when player is nearby
      if(npc.talkCd>0){npc.talkCd--;}
      else if(Math.abs(npc.x-p.x)<=7&&Math.abs(npc.y-p.y)<=7){
        const line=npc.dialogue[Math.floor(Math.random()*npc.dialogue.length)];
        this.floats.push({text:`"${line}"`,x:npc.x,y:(npc.y-2.2)*TILE,color:'#FFE080',ttl:120,dy:0});
        npc.talkCd=280+Math.floor(Math.random()*200);
      }
      if(npc.role==='warrior')this._npcWarriorAI(npc);
      else this._npcWander(npc,npc.wanderRadius);
    }
  }
  _npcWarriorAI(npc){
    npc.atkCd=Math.max(0,npc.atkCd-1);
    npc.moveCd=Math.max(0,npc.moveCd-1);
    // Find nearest alive monster within range
    const tgt=this.monsters
      .filter(m=>m.alive&&Math.max(Math.abs(m.x-npc.x),Math.abs(m.y-npc.y))<=14)
      .sort((a,b)=>(Math.abs(a.x-npc.x)+Math.abs(a.y-npc.y))-(Math.abs(b.x-npc.x)+Math.abs(b.y-npc.y)))[0];
    if(tgt){
      const dist=Math.max(Math.abs(tgt.x-npc.x),Math.abs(tgt.y-npc.y));
      if(dist<=1&&npc.atkCd===0){
        npc.atkCd=npc.spd;
        const dmg=Math.max(1,npc.atk-Math.floor(tgt.def/2));
        const actual=tgt.damage(dmg);
        this.events.push({t:'blood',x:tgt.x,y:tgt.y});
        if(!tgt.alive)this.log(`${npc.name} derrotou ${tgt.name}!`,'#FFAA44');
      }else if(dist>1&&npc.moveCd===0){
        npc.moveCd=npc.spd;
        npc.pathAge++;
        if(npc.pathAge>8||!npc.path.length){
          npc.path=aStar(this.map.passable.bind(this.map),npc.x,npc.y,tgt.x,tgt.y,120);
          npc.pathAge=0;
        }
        if(npc.path.length){
          const[nx,ny]=npc.path.shift();
          const blocked=this.npcs.some(n=>n!==npc&&n.x===nx&&n.y===ny);
          if(this.map.passable(nx,ny)&&!blocked){npc.x=nx;npc.y=ny;}
        }
      }
    }else{
      this._npcWander(npc,npc.wanderRadius);
    }
  }
  _npcWander(npc,radius){
    npc.moveCd=Math.max(0,npc.moveCd-1);
    if(npc.moveCd>0||Math.random()>.015)return;
    npc.moveCd=30+Math.floor(Math.random()*50);
    const dirs=[[-1,0],[1,0],[0,-1],[0,1]];
    const[dx,dy]=dirs[Math.floor(Math.random()*4)];
    const nx=npc.x+dx,ny=npc.y+dy;
    const inRadius=Math.abs(nx-npc.spawnX)<=radius&&Math.abs(ny-npc.spawnY)<=radius;
    const blocked=this.npcs.some(n=>n!==npc&&n.x===nx&&n.y===ny);
    if(this.map.passable(nx,ny)&&inRadius&&!blocked){npc.x=nx;npc.y=ny;}
  }
  interactNPC(npc){
    if(!npc.alive)return;
    const dist=Math.max(Math.abs(npc.x-this.player.x),Math.abs(npc.y-this.player.y));
    if(dist>2){this.log(`Aproxime-se de ${npc.name} para interagir!`,'#AAAAAA');return;}
    const line=npc.dialogue[Math.floor(Math.random()*npc.dialogue.length)];
    this.floats.push({text:`"${line}"`,x:npc.x,y:(npc.y-2.2)*TILE,color:'#FFE080',ttl:120,dy:0});
    this.log(`${npc.name}: "${line}"`,'#FFE080');
    if(npc.role==='merchant')openShop(npc);
  }
  enterDungeon(hx,hy){
    const key=`${hx}_${hy}`;
    if(!this.dungeons[key]){
      const diff=key==='60_60'?1:key==='35_85'?2:3;
      const dmap=new DungeonMap(diff);
      const mons=[];
      const pool=dmap.monsterIdxs;
      const cnt=10+diff*6;
      for(let i=0;i<cnt;i++){
        const mi=pool[Math.floor(Math.random()*pool.length)];
        let mx,my,t=0;
        do{mx=22+Math.floor(Math.random()*(MAP_W-44));my=22+Math.floor(Math.random()*(MAP_H-44));t++;}
        while((!dmap.passable(mx,my)||dmap.get(mx,my)==='U')&&t<300);
        if(t<300)mons.push(new Monster(mx,my,mi));
      }
      this.dungeons[key]={map:dmap,monsters:mons,diff};
    }
    this._surfaceMap=this.map;this._surfaceMonsters=this.monsters;
    this._surfacePx=this._preMoveX;this._surfacePy=this._preMoveY;
    const d=this.dungeons[key];
    this.map=d.map;this.monsters=d.monsters;
    this.player.x=d.map.entryX;this.player.y=d.map.entryY;
    this.map.reveal(this.player.x,this.player.y,10);
    this.currentFloor=d.diff;
    const name=DUNGEON_NAMES[d.diff-1]||'Masmorra';
    sfx.dungeonEnter();
    this.log(`Você entrou na ${name}! Cuidado!`,'#FF8800');
  }
  exitDungeon(){
    this.map=this._surfaceMap;this.monsters=this._surfaceMonsters;
    this.player.x=this._surfacePx;this.player.y=this._surfacePy;
    this.currentFloor=0;
    sfx.dungeonExit();
    this.log('Você retornou à superfície!','#00FF88');
  }
  _checkTransition(){
    const p=this.player;
    const t=this.map.get(p.x,p.y);
    if(t==='H'&&this.currentFloor===0)this.enterDungeon(p.x,p.y);
    else if(t==='U'&&this.currentFloor>0)this.exitDungeon();
  }
  _spawnZone(cx,cy,minD,maxD){
    const distO=Math.max(Math.abs(cx-30),Math.abs(cy-30));
    const maxLvl=Math.max(1,Math.floor(distO/8)+2);
    const elig=MONSTERS.map((_,i)=>i).filter(i=>MONSTERS[i][9]<=maxLvl);
    if(!elig.length)return;
    const count=3+Math.floor(Math.random()*5);
    for(let i=0;i<count;i++){
      const angle=Math.random()*Math.PI*2;
      const dist=minD+Math.floor(Math.random()*(maxD-minD));
      const mx=Math.round(cx+dist*Math.cos(angle));
      const my=Math.round(cy+dist*Math.sin(angle));
      if(this.map.passable(mx,my))
        this.monsters.push(new Monster(mx,my,elig[Math.floor(Math.random()*elig.length)]));
    }
  }
}

// ═══════════════════════════════════════════════════════
//  SPRITE CACHE — pre-renders all sprites with pixel-art black outlines
// ═══════════════════════════════════════════════════════
class SpriteCache {
  constructor() { this.s = {}; }

  build() {
    for (const [voc, data] of Object.entries(VOCATIONS)) {
      const raw = this._makeCanvas(32, 32);
      this._drawPlayer(raw.getContext('2d'), voc, data.color);
      this.s[`p_${voc}`]    = this._outline(raw);
      this.s[`p_${voc}_f`]  = this._whiteFlash(this.s[`p_${voc}`]);
    }
    MONSTERS.forEach(([,,,,,,,,,,], idx) => {
      const [name, color] = MONSTERS[idx];
      const raw = this._makeCanvas(32, 32);
      this._drawMonster(raw.getContext('2d'), idx, color);
      this.s[`m_${idx}`]   = this._outline(raw);
      this.s[`m_${idx}_f`] = this._whiteFlash(this.s[`m_${idx}`]);
    });
  }

  get(key) { return this.s[key]; }

  _makeCanvas(w, h) {
    const c = document.createElement('canvas');
    c.width = w; c.height = h; return c;
  }

  _outline(src) {
    const W = src.width, H = src.height;
    const px = src.getContext('2d').getImageData(0, 0, W, H).data;
    const OW = W + 2, OH = H + 2;
    const out = this._makeCanvas(OW, OH);
    const oc = out.getContext('2d');
    const img = oc.createImageData(OW, OH);
    const d = img.data;

    // Copy source pixels shifted by (1,1)
    for (let y = 0; y < H; y++) {
      for (let x = 0; x < W; x++) {
        const si = (y * W + x) * 4;
        if (px[si + 3] > 20) {
          const di = ((y + 1) * OW + (x + 1)) * 4;
          d[di] = px[si]; d[di+1] = px[si+1]; d[di+2] = px[si+2]; d[di+3] = px[si+3];
        }
      }
    }

    // Snapshot before outline pass
    const snap = new Uint8ClampedArray(d);
    for (let y = 0; y < OH; y++) {
      for (let x = 0; x < OW; x++) {
        const si = (y * OW + x) * 4;
        if (snap[si + 3] <= 20) continue;
        for (let dy = -1; dy <= 1; dy++) {
          for (let dx = -1; dx <= 1; dx++) {
            if (dx === 0 && dy === 0) continue;
            const nx = x + dx, ny = y + dy;
            if (nx < 0 || ny < 0 || nx >= OW || ny >= OH) continue;
            const ni = (ny * OW + nx) * 4;
            if (snap[ni + 3] < 20) {
              d[ni] = 0; d[ni+1] = 0; d[ni+2] = 0; d[ni+3] = 255;
            }
          }
        }
      }
    }
    oc.putImageData(img, 0, 0);
    return out;
  }

  _whiteFlash(src) {
    const out = this._makeCanvas(src.width, src.height);
    const ctx = out.getContext('2d');
    ctx.drawImage(src, 0, 0);
    ctx.globalCompositeOperation = 'source-in';
    ctx.fillStyle = '#FFFFFF';
    ctx.fillRect(0, 0, src.width, src.height);
    return out;
  }

  // ── color helpers ──
  _hex(h) {
    const n = parseInt(h.replace('#',''), 16);
    return [(n>>16)&255, (n>>8)&255, n&255];
  }
  _rgb(r,g,b) {
    return `#${Math.min(255,Math.max(0,r)).toString(16).padStart(2,'0')}${Math.min(255,Math.max(0,g)).toString(16).padStart(2,'0')}${Math.min(255,Math.max(0,b)).toString(16).padStart(2,'0')}`;
  }
  _lt(hex, a) { const[r,g,b]=this._hex(hex); return this._rgb(r+a,g+a,b+a); }
  _dk(hex, a) { const[r,g,b]=this._hex(hex); return this._rgb(r-a,g-a,b-a); }

  _drawPlayer(c, voc, color) {
    const T=32;
    // Shadow (not in sprite, drawn separately)

    // Boots
    c.fillStyle='#2A1A0A';
    c.fillRect(9,26,5,6);   // left boot
    c.fillRect(18,26,5,6);  // right boot
    c.fillStyle='#3E2010';
    c.fillRect(10,28,4,4);  // boot toe left
    c.fillRect(19,28,4,4);  // boot toe right

    // Greaves
    c.fillStyle=this._dk(color,30);
    c.fillRect(10,19,5,8);
    c.fillRect(17,19,5,8);
    c.fillStyle=this._lt(color,10);
    c.fillRect(11,20,2,5);  // shin highlight

    // Body armor
    c.fillStyle=color;
    c.fillRect(8,11,16,9);
    // Armor highlights
    c.fillStyle=this._lt(color,45);
    c.fillRect(9,12,7,3);
    // Armor shadow
    c.fillStyle=this._dk(color,35);
    c.fillRect(8,18,16,2);
    // Center chest line
    c.fillStyle=this._dk(color,50);
    c.fillRect(15,12,2,7);

    // Shoulder plates
    c.fillStyle=this._lt(color,20);
    c.fillRect(6,10,5,4);
    c.fillRect(21,10,5,4);
    c.fillStyle=this._lt(color,50);
    c.fillRect(7,10,2,2);

    // Arms
    c.fillStyle=color;
    c.fillRect(5,13,4,7);
    c.fillRect(23,13,4,7);
    c.fillStyle=this._dk(color,20);
    c.fillRect(5,19,4,2);
    c.fillRect(23,19,4,2);

    // Head skin
    c.fillStyle='#FFDBB5';
    c.fillRect(11,6,10,7);
    // Eyes
    c.fillStyle='#442200';
    c.fillRect(13,9,2,2);
    c.fillRect(17,9,2,2);
    // Nose
    c.fillStyle='#E8B090';
    c.fillRect(15,11,2,1);

    // Helmet
    c.fillStyle=this._dk(color,15);
    c.fillRect(10,3,12,5);  // dome
    c.fillRect(9,6,3,3);    // left guard
    c.fillRect(20,6,3,3);   // right guard
    c.fillRect(9,8,14,2);   // visor brow
    // Visor slit
    c.fillStyle='#111';
    c.fillRect(11,9,4,2);
    c.fillRect(17,9,4,2);
    // Helmet highlight
    c.fillStyle=this._lt(color,55);
    c.fillRect(11,4,5,2);

    // Sword (right side)
    c.fillStyle='#CCCCCC';
    c.fillRect(28,7,3,17);   // blade
    c.fillStyle='#EEEEEE';
    c.fillRect(28,8,2,3);    // blade gleam
    c.fillStyle='#FFD700';
    c.fillRect(26,15,7,2);   // crossguard
    c.fillStyle='#8B4513';
    c.fillRect(29,17,2,5);   // grip
    c.fillStyle='#CC8800';
    c.fillRect(28,22,4,2);   // pommel

    // Shield (left side) for Knight/Paladin
    if (voc === 'Knight' || voc === 'Paladin') {
      c.fillStyle='#8B4513';
      c.fillRect(1,11,5,8);
      c.fillStyle='#CC2200';
      c.fillRect(2,12,3,6);
      c.fillStyle='#FFD700';
      c.fillRect(3,14,1,2);
    }
    // Staff for Sorcerer/Druid
    if (voc === 'Sorcerer' || voc === 'Druid') {
      c.fillStyle='#6B3A1F';
      c.fillRect(27,5,3,22);
      c.fillStyle=voc==='Sorcerer'?'#9900CC':'#117700';
      c.fillRect(25,4,7,5);
      c.fillStyle='#FFFFFF';
      c.fillRect(28,5,2,2);
    }
  }

  _drawMonster(c, idx, color) {
    const T=32;
    switch(idx) {
      case 0: this._rat(c,color); break;
      case 1: this._snake(c,color); break;
      case 2: this._wolf(c,color); break;
      case 3: this._orc(c,color); break;
      case 4: this._troll(c,color); break;
      case 5: this._skeleton(c,color); break;
      case 6: this._zombie(c,color); break;
      case 7: this._spider(c,color); break;
      case 8: this._slime(c,color); break;
      case 9: this._minotaur(c,color); break;
      case 10: this._dragon(c,color); break;
      case 11: this._demon(c,color); break;
    }
  }

  _rat(c, col) {
    c.fillStyle=col;
    c.fillRect(7,14,18,11);    // body
    c.fillRect(21,11,9,8);     // head
    c.fillStyle='#FF9999';
    c.fillRect(22,9,3,5);      // ear
    c.fillRect(26,9,3,5);
    c.fillStyle=this._lt(col,30);
    c.fillRect(9,15,6,4);      // belly highlight
    c.fillStyle='#FF2222';
    c.fillRect(27,13,3,3);     // eye
    c.fillStyle=this._dk(col,20);
    c.fillRect(9,23,4,3);      // paws
    c.fillRect(15,23,4,3);
    c.fillRect(20,23,4,3);
    // Tail
    c.fillStyle='#CC9977';
    c.fillRect(2,18,7,2);
    c.fillRect(2,20,4,2);
    c.fillRect(2,22,2,2);
    // Nose
    c.fillStyle='#FF6688';
    c.fillRect(29,15,2,2);
    // Whiskers (1px lines)
    c.fillStyle='#FFDDAA';
    c.fillRect(25,14,4,1);
    c.fillRect(25,16,4,1);
  }

  _snake(c, col) {
    c.fillStyle=col;
    // S-curve body
    c.fillRect(17,3,8,6);     // head
    c.fillRect(18,8,9,4);     // neck
    c.fillRect(13,11,13,5);   // upper body
    c.fillRect(7,15,13,5);    // mid body
    c.fillRect(4,19,10,5);    // lower body
    c.fillRect(4,23,5,4);     // tail
    c.fillStyle=this._dk(col,25);
    c.fillRect(17,5,2,2);
    c.fillRect(21,9,2,2);
    c.fillRect(17,12,2,2);
    c.fillRect(11,16,2,2);
    c.fillRect(7,20,2,2);
    // Eye
    c.fillStyle='#FF8800';
    c.fillRect(22,5,3,3);
    c.fillStyle='#000';
    c.fillRect(23,6,1,1);
    // Tongue
    c.fillStyle='#FF2222';
    c.fillRect(25,7,5,1);
    c.fillRect(28,6,2,1);
    c.fillRect(28,8,2,1);
    // Scale pattern
    c.fillStyle=this._lt(col,20);
    c.fillRect(14,12,3,2);
    c.fillRect(8,16,3,2);
  }

  _wolf(c, col) {
    c.fillStyle=col;
    c.fillRect(4,13,22,11);   // body
    c.fillRect(19,7,11,8);    // head/neck
    // Ears
    c.fillStyle=this._dk(col,15);
    c.fillRect(20,4,4,6);     // left ear
    c.fillRect(26,4,4,6);     // right ear
    c.fillStyle='#FF9999';
    c.fillRect(21,5,2,4);     // inner ear
    c.fillRect(27,5,2,4);
    // Muzzle
    c.fillStyle=this._lt(col,15);
    c.fillRect(27,10,5,5);
    // Nose
    c.fillStyle='#111';
    c.fillRect(29,10,3,3);
    // Eye
    c.fillStyle='#DDDD00';
    c.fillRect(22,8,4,4);
    c.fillStyle='#000';
    c.fillRect(23,9,2,2);
    // Tail
    c.fillStyle=col;
    c.fillRect(1,10,5,5);
    c.fillRect(1,8,4,3);
    c.fillStyle=this._lt(col,20);
    c.fillRect(2,10,2,3);
    // Legs
    c.fillStyle=this._dk(col,20);
    c.fillRect(5,22,4,7);
    c.fillRect(11,22,4,7);
    c.fillRect(17,22,4,7);
    c.fillRect(22,21,4,7);
    // Fur texture
    c.fillStyle=this._lt(col,25);
    c.fillRect(7,14,5,4);
    c.fillRect(13,13,4,3);
    // Claws
    c.fillStyle='#AAA';
    c.fillRect(5,28,2,2);c.fillRect(8,28,2,2);
    c.fillRect(11,28,2,2);c.fillRect(14,28,2,2);
  }

  _orc(c, col) {
    // Boots
    c.fillStyle='#2E1B0A';
    c.fillRect(8,26,6,5);
    c.fillRect(18,26,6,5);

// ═══════════════════════════════════════════════════════
//  PARTICLE SYSTEM
// ═══════════════════════════════════════════════════════
class ParticleSystem {
  constructor() { this.p = []; }

  spawnBlood(wx, wy, count=7) {
    for (let i = 0; i < count; i++) {
      const angle = Math.random() * Math.PI * 2;
      const spd = 0.5 + Math.random() * 2.5;
      this.p.push({
        type: 0, // blood
        x: wx, y: wy,
        vx: Math.cos(angle) * spd,
        vy: Math.sin(angle) * spd - 1.5,
        life: 30 + Math.random() * 25,
        maxLife: 55,
        size: 2 + Math.random() * 3,
        g: 0.12,
      });
    }
  }

  spawnCrit(wx, wy, count=10) {
    for (let i = 0; i < count; i++) {
      const angle = (Math.PI * 2 * i / count) + Math.random() * 0.4;
      this.p.push({
        type: 1,
        x: wx, y: wy,
        vx: Math.cos(angle) * (1 + Math.random() * 1.5),
        vy: Math.sin(angle) * (1 + Math.random() * 1.5) - 1,
        life: 30 + Math.random() * 20, maxLife: 50,
        size: 2 + Math.random() * 4, g: 0, rgb: null,
      });
    }
  }

  spawnSpell(wx, wy, hexColor, count=12) {
    const num = parseInt(hexColor.replace('#',''), 16);
    const rgb = [(num>>16)&255, (num>>8)&255, num&255];
    for (let i = 0; i < count; i++) {
      const angle = (Math.PI * 2 * i / count) + Math.random() * 0.5;
      const spd = 0.8 + Math.random() * 2;
      this.p.push({
        type: 2,
        x: wx, y: wy,
        vx: Math.cos(angle) * spd,
        vy: Math.sin(angle) * spd - 0.8,
        life: 25 + Math.random() * 20, maxLife: 45,
        size: 2 + Math.random() * 5, g: -0.03, rgb,
      });
    }
  }

  spawnHeal(wx, wy, count=10) {
    for (let i = 0; i < count; i++) {
      this.p.push({
        type: 3,
        x: wx + (Math.random()-0.5)*20,
        y: wy + (Math.random()-0.5)*10,
        vx: (Math.random()-0.5)*0.8,
        vy: -(1 + Math.random() * 2),
        life: 35 + Math.random() * 20, maxLife: 55,
        size: 3 + Math.random() * 4, g: 0,
      });
    }
  }

  update() {
    for (const p of this.p) {
      p.x += p.vx; p.y += p.vy;
      p.vy += p.g;
      p.vx *= 0.92; p.vy *= 0.95;
      p.life--;
      p.size *= 0.97;
    }
    this.p = this.p.filter(p => p.life > 0 && p.size > 0.5);
  }

  draw(ctx, camX, camY) {
    for (const p of this.p) {
      const alpha = Math.min(1, p.life / (p.maxLife * 0.5));
      const sx = p.x - camX, sy = p.y - camY;
      if (p.type === 0) {
        const t = 1 - p.life / p.maxLife;
        ctx.fillStyle = `rgba(${180+Math.floor(50*t)},${Math.floor(20*(1-t))},0,${alpha})`;
      } else if (p.type === 1) {
        const t = 1 - p.life / p.maxLife;
        ctx.fillStyle = `rgba(${Math.floor(100+155*t)},120,255,${alpha})`;
      } else if (p.type === 2 && p.rgb) {
        const [r,g,b] = p.rgb;
        ctx.fillStyle = `rgba(${r},${g},${b},${alpha})`;
      } else if (p.type === 3) {
        // Heal: green rising sparkles
        ctx.fillStyle = `rgba(0,${Math.floor(180+75*p.life/p.maxLife)},80,${alpha})`;
      }
      const s = Math.max(1, p.size);
      ctx.fillRect(sx - s/2, sy - s/2, s, s);
    }
  }
}

    this.particles = new ParticleSystem();
    this.mapW = 0; this.mapH = 0; this.uiW = 0; this.chatH = 0;
    this.spellBtnRects = [];
    this._mmCanvas = null;
    this._fogCanvas = null;
    this._fogPx = -9999; this._fogPy = -9999;
    this._lastFloor = -1;
    // Pre-built tile canvases (keyed by type + tile coord for variety)
    this._tileCache = {};
  }

  resize(mapW, uiW, chatH) {
    this.mapW = mapW; this.uiW = uiW; this.chatH = chatH;
    this.canvas.width = mapW + uiW;
    this.canvas.height = window.innerHeight;
    this.mapH = window.innerHeight - chatH;
    this.ctx.imageSmoothingEnabled = false;
  }

  // ── Tile drawing (improved Tibia-style) ──
  _tile(ctx, sx, sy, type, tx, ty) {
    const T = TILE;
    const seed = ((tx * 7 + ty * 13) ^ (tx * ty)) & 0xFF;

    if (type === 'G') {
      // Grass: base + random blades
      ctx.fillStyle = '#3A7A1E';
      ctx.fillRect(sx, sy, T, T);
      // Subtle variation patches
      if (seed % 3 === 0) { ctx.fillStyle='#2E6A18'; ctx.fillRect(sx+seed%8,sy+seed%6,T/2,T/2); }
      ctx.fillStyle = '#2D6018';
      // Grass blades (deterministic)
      for (let i = 0; i < 8; i++) {
        const bx = ((seed*17+i*31)%T+T)%T;
        const by = ((seed*23+i*13)%T+T)%T;
        ctx.fillRect(sx+bx, sy+by, 2, 3);
        ctx.fillRect(sx+bx+1, sy+by-1, 1, 2);
      }
      ctx.fillStyle = '#448A24';
      for (let i = 0; i < 4; i++) {
        const bx = ((seed*11+i*41)%T+T)%T;
        const by = ((seed*29+i*19)%T+T)%T;
        ctx.fillRect(sx+bx, sy+by, 1, 2);
      }

    } else if (type === 'S') {
      // Stone floor: cobblestone 2x2 pattern
      const c = ['#666666','#5E5E5E','#6C6C6C','#595959'];
      const s = T/2;
      ctx.fillStyle = '#444';
      ctx.fillRect(sx, sy, T, T); // mortar
      ctx.fillStyle = c[seed%4];         ctx.fillRect(sx+1,   sy+1,   s-2, s-2);
      ctx.fillStyle = c[(seed+1)%4];     ctx.fillRect(sx+s+1, sy+1,   s-2, s-2);
      ctx.fillStyle = c[(seed+2)%4];     ctx.fillRect(sx+1,   sy+s+1, s-2, s-2);
      ctx.fillStyle = c[(seed+3)%4];     ctx.fillRect(sx+s+1, sy+s+1, s-2, s-2);
      // Stone highlights
      ctx.fillStyle='rgba(255,255,255,.12)';
      ctx.fillRect(sx+1, sy+1, s-2, 2);
      ctx.fillRect(sx+s+1, sy+s+1, s-2, 2);
      ctx.fillStyle='rgba(0,0,0,.2)';
      ctx.fillRect(sx+1, sy+s-3, s-2, 2);
      ctx.fillRect(sx+s+1, sy+T-3, s-2, 2);

    } else if (type === 'F') {
      // Dungeon floor: dark stone slabs
      ctx.fillStyle = '#282828';
      ctx.fillRect(sx, sy, T, T);
      ctx.fillStyle = '#222';
      ctx.fillRect(sx, sy, T, 1);  // top edge
      ctx.fillRect(sx, sy, 1, T);  // left edge
      // Crack detail
      if (seed % 5 === 0) {
        ctx.fillStyle = '#1A1A1A';
        ctx.fillRect(sx+seed%12+4, sy+seed%8+4, 8, 1);
        ctx.fillRect(sx+seed%12+8, sy+seed%8+4, 1, 6);
      }
      ctx.fillStyle='rgba(255,255,255,.05)';
      ctx.fillRect(sx+1, sy+1, T-2, 2);

    } else if (type === 'D') {
      // Dirt: earthy with pebble marks
      ctx.fillStyle = '#8B6914';
      ctx.fillRect(sx, sy, T, T);
      ctx.fillStyle = '#7A5A10';
      for (let i = 0; i < 5; i++) {
        const px = ((seed*13+i*21)%T+T)%T;
        const py = ((seed*17+i*11)%T+T)%T;
        ctx.fillRect(sx+px, sy+py, 3, 2);
      }
      ctx.fillStyle = '#9A7820';
      ctx.fillRect(sx+seed%10+2, sy+seed%8+2, 4, 3);

    } else if (type === 'N') {
      // Sand
      ctx.fillStyle = '#C8A850';
      ctx.fillRect(sx, sy, T, T);
      ctx.fillStyle = '#A88A30';
      for (let i = 0; i < 4; i++) {
        const px = ((seed*11+i*29)%T+T)%T;
        const py = ((seed*19+i*17)%T+T)%T;
        ctx.fillRect(sx+px, sy+py, 2, 2);
      }
      ctx.fillStyle='rgba(255,255,200,.15)';
      ctx.fillRect(sx+seed%16+2, sy+seed%12+2, 6, 2);

    } else if (type === 'W') {
      // Water: animated waves
      ctx.fillStyle = '#1A4A7A';
      ctx.fillRect(sx, sy, T, T);
      const wave = Math.sin(this.tick * 0.05 + tx * 0.5 + ty * 0.3);
      const wave2 = Math.sin(this.tick * 0.07 + tx * 0.3 - ty * 0.5);
      ctx.fillStyle = `rgba(80,140,220,${0.18 + wave*0.08})`;
      ctx.fillRect(sx, sy + Math.floor(T*0.3 + wave*2), T, 4);
      ctx.fillRect(sx, sy + Math.floor(T*0.65 + wave2*2), T, 3);
      ctx.fillStyle = `rgba(150,200,255,${0.12 + wave2*0.05})`;
      ctx.fillRect(sx + 2, sy + Math.floor(T*0.3 + wave*2) - 1, T-4, 2);

    } else if (type === 'X' || type === 'V') {
      // Walls: 3D stone brick
      const base = type === 'X' ? '#4A4040' : '#252020';
      const lit  = type === 'X' ? '#5A5050' : '#302828';
      const dark = type === 'X' ? '#333030' : '#181010';
      ctx.fillStyle = base;
      ctx.fillRect(sx, sy, T, T);
      // Brick rows
      ctx.fillStyle = dark;
      ctx.fillRect(sx, sy + T/2, T, 2);  // mortar row
      // Brick lines (offset each row)
      const off = (ty % 2 === 0) ? 0 : T/2;
      ctx.fillRect(sx + (T/2 - off + T) % T, sy, 2, T/2);
      ctx.fillRect(sx + off, sy + T/2, 2, T/2);
      // Top edge light
      ctx.fillStyle = lit;
      ctx.fillRect(sx, sy, T, 3);
      ctx.fillRect(sx, sy, 3, T);
      // Bottom shadow
      ctx.fillStyle = dark;
      ctx.fillRect(sx, sy + T-3, T, 3);
      ctx.fillRect(sx + T-3, sy, 3, T);

    } else if (type === 'T') {
      // Tree
      ctx.fillStyle = '#3A7A1E';
      ctx.fillRect(sx, sy, T, T);
      // Trunk
      ctx.fillStyle = '#5C3317';
      ctx.fillRect(sx+T*.38|0, sy+T*.55|0, T*.24|0, T*.45|0);
      ctx.fillStyle = '#7A4A25';
      ctx.fillRect(sx+T*.40|0, sy+T*.56|0, T*.08|0, T*.43|0);
      // Foliage (3 layers)
      ctx.fillStyle = '#1B5E20';
      ctx.fillRect(sx+3, sy+T*.2|0, T-6, T*.48|0);
      ctx.fillRect(sx+6, sy+T*.08|0, T-12, T*.28|0);
      ctx.fillStyle = '#2E7D32';
      ctx.fillRect(sx+6, sy+T*.22|0, T-12, T*.3|0);
      ctx.fillRect(sx+9, sy+T*.1|0, T-18, T*.2|0);
      // Highlight
      ctx.fillStyle = '#4CAF50';
      ctx.fillRect(sx+8, sy+T*.12|0, 5, 4);
      ctx.fillRect(sx+7, sy+T*.25|0, 5, 4);

    } else if (type === 'M') {
      // Mountain
      ctx.fillStyle = '#4A4040';
      ctx.fillRect(sx, sy, T, T);
      ctx.fillStyle = '#6D5C5C';
      ctx.fillRect(sx+2, sy+T*.5|0, T-4, T*.5|0);
      ctx.fillRect(sx+4, sy+T*.25|0, T-8, T*.35|0);
      ctx.fillRect(sx+8, sy+2, T-16, T*.3|0);
      // Snow cap
      ctx.fillStyle = '#EEE';
      ctx.fillRect(sx+10, sy+2, T-20, T*.18|0);
      ctx.fillRect(sx+12, sy+2, T-24, T*.1|0);
      // Shadow
      ctx.fillStyle = 'rgba(0,0,0,.3)';
      ctx.fillRect(sx+T/2, sy+T*.25|0, T/2, T*.75|0);

    } else if (type === 'L') {
      // Lava
      ctx.fillStyle = '#CC2200';
      ctx.fillRect(sx, sy, T, T);
      const lw = Math.sin(this.tick * 0.08 + tx + ty);
      ctx.fillStyle = `rgba(255,${100+Math.floor(lw*40)},0,0.6)`;
      ctx.fillRect(sx + 2, sy + Math.floor(T*0.3 + lw*3), T-4, 5);
      ctx.fillStyle = 'rgba(255,220,0,.3)';
      ctx.fillRect(sx + 6, sy + Math.floor(T*0.6 + lw*2), T-12, 3);

    } else if (type === 'H') {
      // Dungeon hole entrance
      ctx.fillStyle = '#0C0C0C';
      ctx.fillRect(sx, sy, T, T);
      ctx.fillStyle = '#000';
      ctx.fillRect(sx+5, sy+5, T-10, T-10);
      const pulse = (Math.sin(this.tick*0.07 + tx*0.4 + ty*0.6) + 1) * 0.5;
      ctx.fillStyle = `rgba(80,30,0,${0.15 + pulse*0.35})`;
      ctx.fillRect(sx+5, sy+5, T-10, T-10);
      // Rim highlight
      ctx.fillStyle = '#222';
      ctx.fillRect(sx+2, sy+2, T-4, 3); ctx.fillRect(sx+2, sy+2, 3, T-4);
      // Down arrow (pulsing)
      ctx.font = `bold ${Math.floor(T*.44)}px monospace`;
      ctx.fillStyle = `rgba(255,130,0,${0.5+pulse*0.45})`;
      ctx.textAlign = 'center';
      ctx.fillText('▼', sx+T/2, sy+T*0.72|0);
      ctx.textAlign = 'left';

    } else if (type === 'U') {
      // Stairs up (inside dungeon)
      ctx.fillStyle = '#1E1408';
      ctx.fillRect(sx, sy, T, T);
      const steps = 4;
      for (let i = 0; i < steps; i++) {
        const sw = T - i*5, sh = (T/steps)|0;
        const ox = sx + (i*2.5)|0, oy = sy + i*sh;
        ctx.fillStyle = i%2===0 ? '#7A5914' : '#50380A';
        ctx.fillRect(ox, oy, sw, sh);
        ctx.fillStyle = 'rgba(255,255,255,.14)';
        ctx.fillRect(ox, oy, sw, 2);
        ctx.fillStyle = 'rgba(0,0,0,.28)';
        ctx.fillRect(ox, oy+sh-2, sw, 2);
      }
      ctx.font = `bold ${Math.floor(T*.4)}px monospace`;
      ctx.fillStyle = '#FFD700';
      ctx.textAlign = 'center';
      ctx.fillText('▲', sx+T/2, sy+(T*.66)|0);
      ctx.textAlign = 'left';

    } else {
      // Fallback
      ctx.fillStyle = TILE_DEF[type]?.[0] || '#333';
      ctx.fillRect(sx, sy, T, T);
    }
  }

  // ── Entity drawing using pre-rendered sprites ──
  _shadow(ctx, sx, sy) {
    ctx.fillStyle = 'rgba(0,0,0,.35)';
    ctx.beginPath();
    ctx.ellipse(sx + TILE/2, sy + TILE - 4, TILE*0.32, TILE*0.11, 0, 0, Math.PI*2);
    ctx.fill();
  }

  _drawEntity(ctx, sx, sy, spriteKey, flashKey, flashTick) {
    const spr = this.sprites.get(flashTick > 0 && flashTick % 2 === 0 ? flashKey : spriteKey);
    if (spr) ctx.drawImage(spr, sx - 1, sy - 1);
  }

  _hpBar(ctx, sx, sy, hp, maxHp, name, nameColor) {
    const T = TILE;
    const bw = T + 8, bh = 5;
    const bx = sx + (T - bw)/2, by = sy - 14;
    // Background
    ctx.fillStyle = '#111';
    ctx.fillRect(bx, by, bw, bh);
    ctx.fillStyle = '#333';
    ctx.fillRect(bx+1, by+1, bw-2, bh-2);
    // Fill
    const pct = Math.max(0, hp/maxHp);
    ctx.fillStyle = pct > 0.6 ? '#00CC00' : pct > 0.3 ? '#CCCC00' : '#CC0000';
    if (pct > 0) ctx.fillRect(bx+1, by+1, Math.floor((bw-2)*pct), bh-2);
    // Name label
    ctx.font = 'bold 9px monospace';
    const nw = ctx.measureText(name).width;
    ctx.fillStyle = 'rgba(0,0,0,.7)';
    ctx.fillRect(sx+T/2-nw/2-2, sy-26, nw+4, 12);
    ctx.fillStyle = nameColor;
    ctx.fillText(name, sx+T/2-nw/2, sy-16);
  }

  render(world) {
    this.tick++;
    // Invalidate minimap cache on floor transitions
    if (world.currentFloor !== this._lastFloor) {
      this._lastFloor = world.currentFloor;
      this._mmCanvas = null; this._fogCanvas = null;
      this._fogPx = -9999; this._fogPy = -9999;
    }
    const ctx = this.ctx;
    const p = world.player;
    const mW = this.mapW, mH = this.mapH;
    const uiX = mW, uiW = this.uiW;
    const cH = this.chatH;
    const W = mW + uiW, H = mH + cH;
    const T = TILE;

    // Camera (centered on animated player position)
    const camX = Math.floor(p.px - mW/2);
    const camY = Math.floor(p.py - mH/2);

    // Clip to map area
    ctx.save();
    ctx.beginPath();
    ctx.rect(0, 0, mW, mH);
    ctx.clip();

    // ── TILES ────────────────────────────────────────
    const startC = Math.max(0, Math.floor(camX/T));
    const endC   = Math.min(MAP_W-1, Math.floor((camX+mW)/T)+1);
    const startR = Math.max(0, Math.floor(camY/T));
    const endR   = Math.min(MAP_H-1, Math.floor((camY+mH)/T)+1);

    for (let r = startR; r <= endR; r++) {
      for (let col = startC; col <= endC; col++) {
        this._tile(ctx, col*T-camX, r*T-camY, world.map.get(col,r), col, r);
      }
    }

    // ── PARTICLES (below entities) ────────────────────
    // Process new events
    for (const ev of world.events) {
      const px = ev.x * T + T/2, py = ev.y * T + T/2;
      if (ev.t === 'blood') this.particles.spawnBlood(px, py);
      else if (ev.t === 'crit') this.particles.spawnCrit(px, py);
      else if (ev.t === 'heal') this.particles.spawnHeal(px, py);
      else if (ev.t === 'spell') this.particles.spawnSpell(px, py, ev.color||'#FFFFFF');
    }
    world.events = [];
    this.particles.update();
    this.particles.draw(ctx, camX, camY);

    // ── MONSTERS ─────────────────────────────────────
    for (const m of world.monsters) {
      if (!m.alive) continue;
      const sx = m.x*T-camX, sy = m.y*T-camY;
      if (sx < -T*2 || sy < -T*2 || sx > mW+T || sy > mH+T) continue;
      this._shadow(ctx, sx, sy);
      this._drawEntity(ctx, sx, sy, `m_${m.monIdx}`, `m_${m.monIdx}_f`, m.flashTick);
      this._hpBar(ctx, sx, sy, m.hp, m.maxHp, m.name, m.color);
    }

    // ── NPCs ─────────────────────────────────────────
    if (world.currentFloor === 0) {
      for (const npc of world.npcs) {
        if (!npc.alive) continue;
        const sx = npc.x*T-camX, sy = npc.y*T-camY;
        if (sx < -T*2 || sy < -T*2 || sx > mW+T || sy > mH+T) continue;
        this._shadow(ctx, sx, sy);
        this._drawEntity(ctx, sx, sy, `p_${npc.voc}`, `p_${npc.voc}_f`, npc.flashTick);
        // Name/title badge
        ctx.font = 'bold 9px monospace';
        const badge = `${npc.name} [${npc.title}]`;
        const bw = ctx.measureText(badge).width;
        ctx.fillStyle = npc.role==='merchant' ? 'rgba(60,40,0,.85)' : 'rgba(0,20,60,.85)';
        ctx.fillRect(sx+T/2-bw/2-3, sy-27, bw+6, 12);
        ctx.fillStyle = npc.role==='merchant' ? '#FFD700' : '#88CCFF';
        ctx.fillText(badge, sx+T/2-bw/2, sy-17);
        if (npc.hp < npc.maxHp) this._hpBar(ctx, sx, sy, npc.hp, npc.maxHp, '', '#FFF');
      }
    }

    // ── PLAYER ───────────────────────────────────────
    const psx = Math.round(p.px - camX) - T/2, psy = Math.round(p.py - camY) - T/2;
    this._shadow(ctx, psx, psy);
    this._drawEntity(ctx, psx, psy, `p_${p.voc}`, `p_${p.voc}_f`, p.flashTick);
    // Player name
    ctx.font = 'bold 10px monospace';
    const pnw = ctx.measureText(p.name).width;
    ctx.fillStyle = 'rgba(0,0,0,.75)';
    ctx.fillRect(psx+T/2-pnw/2-2, psy-26, pnw+4, 12);
    ctx.fillStyle = '#00FF88';
    ctx.fillText(p.name, psx+T/2-pnw/2, psy-16);

    // ── PROJECTILES ──────────────────────────────────
    for (const pr of world.projectiles) {
      const cx = (pr.sx + (pr.tx-pr.sx)*pr.progress) * T - camX + T/2;
      const cy = (pr.sy + (pr.ty-pr.sy)*pr.progress) * T - camY + T/2;
      // Trail
      ctx.globalAlpha = 0.3;
      ctx.strokeStyle = pr.color; ctx.lineWidth = 2;
      ctx.beginPath();
      ctx.moveTo(pr.sx*T-camX+T/2, pr.sy*T-camY+T/2);
      ctx.lineTo(cx, cy);
      ctx.stroke();
      ctx.globalAlpha = 1;
      // Orb
      ctx.fillStyle = pr.color;
      ctx.beginPath(); ctx.arc(cx, cy, 5, 0, Math.PI*2); ctx.fill();
      ctx.fillStyle = '#FFF';
      ctx.beginPath(); ctx.arc(cx-1, cy-1, 2, 0, Math.PI*2); ctx.fill();
    }

    // ── FLOATING DAMAGE TEXTS ────────────────────────
    for (const f of world.floats) {
      const sx = f.x*T - camX + T/2;
      const sy = f.y - camY;
      const alpha = Math.min(1, f.ttl / 30);
      ctx.globalAlpha = alpha;
      ctx.font = `bold ${Math.floor(15 + (1-alpha)*4)}px monospace`;
      const tw = ctx.measureText(f.text).width;
      // Outline
      ctx.strokeStyle = '#000'; ctx.lineWidth = 3;
      ctx.strokeText(f.text, sx - tw/2, sy);
      ctx.fillStyle = f.color;
      ctx.fillText(f.text, sx - tw/2, sy);
      ctx.globalAlpha = 1;
    }

    ctx.restore();

    // ── MAP BORDER ───────────────────────────────────
    ctx.strokeStyle = '#5C3317'; ctx.lineWidth = 2;
    ctx.strokeRect(0, 0, mW, mH);

    // ── UI PANEL ─────────────────────────────────────
    ctx.fillStyle = '#0C0700';
    ctx.fillRect(uiX, 0, uiW, mH);
    ctx.strokeStyle = '#6B4010'; ctx.lineWidth = 2;
    ctx.strokeRect(uiX, 0, uiW, mH);
    const mmBottom = this._drawMinimap(ctx, world, uiX, uiW);
    this._drawUI(ctx, world, uiX, uiW, mH, mmBottom);

    // ── CHAT BOX ─────────────────────────────────────
    ctx.fillStyle = '#080400';
    ctx.fillRect(0, mH, W, cH);
    ctx.strokeStyle = '#5C3317'; ctx.lineWidth = 1;
    ctx.strokeRect(0, mH, W, cH);
    this._drawChat(ctx, world, mH, W, cH);

    // ── DEATH TINT (modal handles interaction) ───────
    if (!p.alive) {
      ctx.fillStyle = 'rgba(80,0,0,.35)';
      ctx.fillRect(0, 0, W, H);
    }
  }

  _buildMinimap(world) {
    const c = document.createElement('canvas');
    c.width = MAP_W; c.height = MAP_H;
    const mctx = c.getContext('2d');
    mctx.imageSmoothingEnabled = false;
    const col = {G:'#3A7A1E',D:'#8B6914',S:'#686868',W:'#1A4A7A',X:'#3A3030',
                 M:'#6D5C5C',T:'#1B5E20',N:'#C8A850',F:'#282828',V:'#101010',L:'#CC2200',
                 H:'#000000',U:'#C8A420'};
    for (let ty = 0; ty < MAP_H; ty++) {
      for (let tx = 0; tx < MAP_W; tx++) {
        mctx.fillStyle = col[world.map.get(tx,ty)] || '#3A7A1E';
        mctx.fillRect(tx, ty, 1, 1);
      }
    }
    this._mmCanvas = c;
    const f = document.createElement('canvas');
    f.width = MAP_W; f.height = MAP_H;
    const fctx = f.getContext('2d');
    fctx.fillStyle = '#000';
    fctx.fillRect(0, 0, MAP_W, MAP_H);
    this._fogCanvas = f;
  }

  _updateFog(world) {
    const p = world.player;
    if (p.x === this._fogPx && p.y === this._fogPy) return;
    this._fogPx = p.x; this._fogPy = p.y;
    const fctx = this._fogCanvas.getContext('2d');
    fctx.globalCompositeOperation = 'destination-out';
    fctx.fillStyle = '#000';
    const rev = world.map.revealed;
    const R = 7;
    for (let dy = -R; dy <= R; dy++) {
      for (let dx = -R; dx <= R; dx++) {
        const ix = p.x+dx, iy = p.y+dy;
        if (ix>=0&&iy>=0&&ix<MAP_W&&iy<MAP_H && rev[iy*MAP_W+ix]) {
          fctx.fillRect(ix, iy, 1, 1);
        }
      }
    }
    fctx.globalCompositeOperation = 'source-over';
  }

  _drawMinimap(ctx, world, ux, uiW) {
    const pad = 6;
    const mmSz = uiW - pad * 2;
    const mx = ux + pad, my = 10;
    const scale = mmSz / MAP_W;
    if (!this._mmCanvas) this._buildMinimap(world);
    this._updateFog(world);
    // Tile bitmap
    ctx.imageSmoothingEnabled = false;
    ctx.drawImage(this._mmCanvas, mx, my, mmSz, mmSz);
    // Fog overlay
    ctx.globalAlpha = 0.80;
    ctx.drawImage(this._fogCanvas, mx, my, mmSz, mmSz);
    ctx.globalAlpha = 1;
    // Viewport rectangle
    const p = world.player;
    const vx = mx + (p.x - this.mapW/(2*TILE)) * scale;
    const vy = my + (p.y - this.mapH/(2*TILE)) * scale;
    const vw = (this.mapW / TILE) * scale;
    const vh = (this.mapH / TILE) * scale;
    ctx.strokeStyle = 'rgba(255,240,160,0.4)'; ctx.lineWidth = 1;
    ctx.strokeRect(vx, vy, vw, vh);
    // Monster dots
    const rev = world.map.revealed;
    ctx.fillStyle = '#FF3300';
    for (const m of world.monsters) {
      if (!m.alive) continue;
      if (!rev[m.y*MAP_W+m.x]) continue;
      const dmx = Math.round(mx + m.x * scale);
      const dmy = Math.round(my + m.y * scale);
      ctx.fillRect(dmx - 1, dmy - 1, 2, 2);
    }
    // Player dot
    const ppx = Math.round(mx + p.x * scale);
    const ppy = Math.round(my + p.y * scale);
    ctx.fillStyle = '#00FF88';
    ctx.fillRect(ppx - 2, ppy - 2, 4, 4);
    ctx.fillStyle = '#FFFFFF';
    ctx.fillRect(ppx - 1, ppy - 1, 2, 2);
    // Border
    ctx.strokeStyle = '#8B6914'; ctx.lineWidth = 1.5;
    ctx.strokeRect(mx - 0.5, my - 0.5, mmSz + 1, mmSz + 1);
    // "MAPA" label
    ctx.fillStyle = 'rgba(0,0,0,0.75)';
    ctx.fillRect(mx + 1, my + 1, 30, 11);
    ctx.font = 'bold 8px monospace';
    ctx.fillStyle = '#C8A860';
    ctx.fillText('MAPA', mx + 3, my + 10);
    return my + mmSz + 6;
  }

  _drawUI(ctx, world, ux, uw, uh, startY = 14) {
    this.spellBtnRects = [];
    const p = world.player;
    let y = startY;
    const tx = ux+8, tw = uw-16;

    const label = (text, color, bold) => {
      ctx.font = (bold?'bold ':'') + '12px monospace';
      ctx.fillStyle = color; ctx.fillText(text, tx, y); y += 18;
    };
    const bar = (pct, fillColor, text, emptyColor) => {
      ctx.fillStyle = emptyColor || '#1a0e05';
      ctx.fillRect(tx, y, tw, 13);
      ctx.fillStyle = fillColor;
      if (pct > 0) ctx.fillRect(tx, y, Math.floor(tw*Math.max(0,Math.min(1,pct))), 13);
      // Bar border
      ctx.strokeStyle = '#3A2010'; ctx.lineWidth = 1;
      ctx.strokeRect(tx, y, tw, 13);
      ctx.font = '9px monospace'; ctx.fillStyle = '#FFF';
      ctx.fillText(text, tx+3, y+10); y += 17;
    };
    const divider = () => {
      ctx.strokeStyle = '#5C3317'; ctx.lineWidth = 1;
      ctx.beginPath(); ctx.moveTo(ux+4, y); ctx.lineTo(ux+uw-4, y); ctx.stroke();
      y += 8;
    };

    // Floor indicator
    if (world.currentFloor > 0) {
      const dn=DUNGEON_NAMES[world.currentFloor-1]||'Masmorra';
      label(`⚠ ${dn}`, '#FF8800', true);
    } else {
      label('◆ Superfície', '#44AA44', false);
    }
    divider();
    label(p.name, '#FFD700', true);
    label(`${p.voc}  Lv.${p.level}`, '#C8A860', false);
    label(`Gold: ${p.gold}`, '#FFD700', false);
    divider();
    bar(p.hp/p.maxHp, p.hp/p.maxHp>.6?'#008800':p.hp/p.maxHp>.3?'#888800':'#880000', `HP ${p.hp}/${p.maxHp}`);
    bar(p.maxMp>0?p.mp/p.maxMp:0, '#004488', `MP ${p.mp}/${p.maxMp}`);
    bar(p.xpNext>0?p.xp/p.xpNext:0, '#226600', `XP ${p.xp}/${p.xpNext}`);
    divider();
    label(`ATK: ${p.totalAtk}  DEF: ${p.totalDef}`, '#AAAAAA', false);
    divider();
    label('EQUIPADO:', '#FFD700', true);
    const slots = {weapon:'⚔',armor:'🛡',helmet:'⛑',legs:'👖',boots:'👟',shield:'🔰',ring:'💍',amulet:'📿'};
    for (const [sl, ic] of Object.entries(slots)) {
      const eq = p.eq[sl];
      if (!eq && (sl==='ring'||sl==='amulet')) continue;
      label(eq ? `${ic} ${ITEMS[eq].n}` : `${ic} —`, eq ? '#88FF88' : '#444444', false);
    }
    divider();
    const hpPots = Object.entries(p.inv).filter(([id])=>ITEMS[id]?.t==='potion'&&ITEMS[id]?.hp>0).reduce((s,[,c])=>s+c,0);
    const mpPots = Object.entries(p.inv).filter(([id])=>ITEMS[id]?.t==='potion'&&ITEMS[id]?.mp>0).reduce((s,[,c])=>s+c,0);
    label(`❤ HP Pots: ${hpPots}`, '#CC4444', false);
    label(`✦ MP Pots: ${mpPots}`, '#4444CC', false);
    divider();
    const nearby = world.monsters
      .filter(m => m.alive && Math.max(Math.abs(m.x-p.x), Math.abs(m.y-p.y)) <= 8)
      .sort((a,b) => Math.max(Math.abs(a.x-p.x),Math.abs(a.y-p.y)) - Math.max(Math.abs(b.x-p.x),Math.abs(b.y-p.y)))
      .slice(0, 4);
    if (nearby.length) {
      label('INIMIGOS:', '#FF4444', true);
      for (const m of nearby) {
        if (y > uh - 22) break;
        ctx.fillStyle = '#1a0e05'; ctx.fillRect(tx, y, tw, 11);
        const hp = Math.max(0, m.hp/m.maxHp);
        ctx.fillStyle = hp>.6?'#006600':hp>.3?'#666600':'#660000';
        if (hp > 0) ctx.fillRect(tx, y, Math.floor(tw*hp), 11);
        ctx.strokeStyle = '#3A2010'; ctx.lineWidth = 1;
        ctx.strokeRect(tx, y, tw, 11);
        ctx.font = '8px monospace'; ctx.fillStyle = '#FFF';
        ctx.fillText(`${m.name} ${m.hp}/${m.maxHp}`, tx+2, y+9);
        y += 14;
      }
    }
    // ── SPELL BAR ──
    divider();
    const allSpells = SPELLS[p.voc] || [];
    const avail = allSpells.filter(s => p.level >= s.lvl);
    if (allSpells.length) {
      label('MAGIAS:', '#CC88FF', true);
      this.spellBtnRects = [];
      for (let i = 0; i < allSpells.length; i++) {
        if (y > uh - 16) break;
        const s = allSpells[i];
        const locked = p.level < s.lvl;
        const cd = p.spellCds[s.id] || 0;
        const onCd = cd > 0;
        // Background button
        ctx.fillStyle = locked ? '#111' : onCd ? '#2A1A00' : '#1A0E2A';
        ctx.fillRect(tx, y, tw, 20);
        ctx.strokeStyle = locked ? '#333' : s.color;
        ctx.lineWidth = 1;
        ctx.strokeRect(tx, y, tw, 20);
        // Number key
        ctx.font = 'bold 10px monospace';
        ctx.fillStyle = locked ? '#444' : s.color;
        ctx.fillText(`[${i+1}]`, tx+2, y+14);
        // Name
        ctx.fillStyle = locked ? '#555' : onCd ? '#888' : '#DDD';
        ctx.fillText(s.name, tx+24, y+14);
        // MP cost (right-aligned)
        ctx.fillStyle = locked ? '#333' : '#4488FF';
        ctx.font = '9px monospace';
        ctx.fillText(`${s.mp}mp`, tx+tw-28, y+13);
        // Cooldown bar
        if (onCd) {
          ctx.fillStyle = '#FF8800';
          ctx.fillRect(tx, y+18, Math.floor(tw*(1-cd/s.cd)), 2);
        }
        // Level lock label
        if (locked) {
          ctx.fillStyle = '#555';
          ctx.fillText(`Lv.${s.lvl}`, tx+tw-28, y+13);
        }
        if (!locked) this.spellBtnRects.push({idx:avail.indexOf(s), x:8, y, w:tw, h:20});
        y += 23;
      }
    }
  }

  _drawChat(ctx, world, cy, W, cH) {
    const msgs = world.chat.slice(-5);
    ctx.font = '11px monospace';
    msgs.forEach((m, i) => {
      ctx.fillStyle = m.color;
      ctx.fillText(m.msg.substring(0, Math.floor(W/7.2)), 7, cy+15+i*18);
    });
  }
}

//  GAME LOOP & INPUT
