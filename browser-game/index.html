let world, renderer, running = false;
let heldDir = null, heldInterval = null;

function setupLayout() {
  const W = window.innerWidth, H = window.innerHeight;
  const chatH = Math.max(60, Math.min(100, H*.18));
  const uiW   = Math.max(160, Math.min(240, W*.28));
  TILE = Math.max(24, Math.min(40, Math.floor((H-chatH)/13)));
  const mapW = W - uiW;
  renderer.resize(mapW, uiW, chatH);

  const btnSz = Math.max(44, Math.min(60, W*.07));
  const dpad = document.getElementById('dpad');
  dpad.style.cssText = `position:absolute;bottom:${chatH+6}px;left:6px;display:grid;grid-template-columns:${btnSz}px ${btnSz}px ${btnSz}px;grid-template-rows:${btnSz}px ${btnSz}px ${btnSz}px;gap:3px;pointer-events:all`;
  document.querySelectorAll('.dp').forEach(d => {
    d.style.width  = btnSz+'px';
    d.style.height = btnSz+'px';
    d.style.fontSize = Math.floor(btnSz*.42)+'px';
  });

  const abW = Math.floor(btnSz*1.1), abH = Math.floor(btnSz*.9);
  const ab = document.getElementById('actionBtns');
  ab.style.cssText = `position:absolute;bottom:${chatH+6}px;left:${btnSz*3+18}px;display:flex;gap:6px;pointer-events:all`;
  document.querySelectorAll('.abtn').forEach(b => {
    b.style.width  = abW+'px';
    b.style.height = abH+'px';
    b.style.fontSize = Math.floor(abW*.22)+'px';
  });

  // Spell bar — full-width strip above the d-pad row
  const dpadH = btnSz * 3 + 6;
  const sbH = Math.max(52, Math.round(btnSz * .9));
  const sb = document.getElementById('spellBar');
  sb.style.cssText = `position:absolute;bottom:${chatH+6+dpadH+5}px;left:0;right:0;height:${sbH}px;padding:0 5px;gap:4px;display:flex;align-items:center;pointer-events:all;overflow-x:auto;overflow-y:hidden;-webkit-overflow-scrolling:touch;scrollbar-width:none`;
  if (world) updateSpellBar(true);
}

let _sbVoc = null, _sbLvl = -1;
function updateSpellBar(force) {
  if (!world) return;
  const p = world.player;
  const allSpells = SPELLS[p.voc] || [];
  const avail = allSpells.filter(s => p.level >= s.lvl);
  const bar = document.getElementById('spellBar');
  if (!bar) return;

  if (force || p.voc !== _sbVoc || p.level !== _sbLvl) {
    _sbVoc = p.voc; _sbLvl = p.level;
    bar.innerHTML = '';
    const W = window.innerWidth;
    const btnSz = Math.max(44, Math.min(60, W * .07));
    const sbH = Math.max(52, Math.round(btnSz * .9));
    const n = allSpells.length || 1;
    const sbW = Math.max(56, Math.floor((W - 10 - 4 * (n - 1)) / n));
    allSpells.forEach(spell => {
      const locked = p.level < spell.lvl;
      const idx = avail.indexOf(spell);
      const btn = document.createElement('button');
      btn.className = 'sbtn' + (locked ? ' locked' : '');
      btn.dataset.sid = spell.id;
      btn.dataset.scd = spell.cd;
      btn.style.cssText = `width:${sbW}px;height:${sbH}px;min-width:${sbW}px;border-color:${spell.color}`;
      const ws = spell.name.split(/\s+/);
      const abbr = ws.length > 1
        ? ws.map(w => (w.replace(/[^a-z]/gi,'') || 'X')[0].toUpperCase()).join('').slice(0, 4)
        : spell.name.replace(/[^a-z]/gi,'').slice(0, 4).toUpperCase();
      const fs1 = Math.max(11, Math.floor(sbH * .22));
      const fs2 = Math.max(9,  Math.floor(sbH * .17));
      btn.innerHTML =
        `<span style="font-size:${fs1}px;font-weight:bold;color:${locked?'#777':spell.color}">${abbr}</span>`+
        `<span style="font-size:${fs2}px;color:${locked?'#555':'#8899CC'}">${spell.mp}mp</span>`+
        (locked ? `<span style="font-size:${Math.max(8,fs2-1)}px;color:#555">Lv${spell.lvl}</span>` : '')+
        `<span class="scd-ov" style="width:0%"></span>`;
      if (!locked) {
        const cast = () => { if (world) world.castSpell(idx); };
        btn.addEventListener('touchstart', e => { e.preventDefault(); cast(); }, {passive:false});
        btn.addEventListener('click', cast);
      }
      bar.appendChild(btn);
    });
  }

  // Update cooldown overlays every frame
  bar.querySelectorAll('.sbtn:not(.locked)').forEach(btn => {
    const cd = world.player.spellCds[btn.dataset.sid] || 0;
    const ov = btn.querySelector('.scd-ov');
    if (ov) ov.style.width = (cd > 0 ? Math.round(cd / btn.dataset.scd * 100) : 0) + '%';
  });
}

// ═══ SAVE / LOAD ═══
const SAVE_KEY = 'tibia_android_v1';

function _packFog(arr) {
  const n = Math.ceil(arr.length / 8);
  let s = '';
  for (let i = 0; i < n; i++) {
    let byte = 0;
    for (let b = 0; b < 8; b++) { if (arr[i*8+b]) byte |= 1<<b; }
    s += String.fromCharCode(byte);
  }
  return btoa(s);
}
function _unpackFog(str) {
  const bytes = atob(str); const out = new Uint8Array(MAP_W*MAP_H);
  for (let i = 0; i < bytes.length; i++) {
    const byte = bytes.charCodeAt(i);
    for (let b = 0; b < 8; b++) { if (byte & (1<<b)) out[i*8+b] = 1; }
  }
  return out;
}

function saveGame() {
  if (!world) return;
  const p = world.player;
  const data = {
    v:1, ts: Date.now(),
    p: {
      name:p.name, voc:p.voc, level:p.level,
      xp:p.xp, hp:p.hp, maxHp:p.maxHp, mp:p.mp, maxMp:p.maxMp,
      atk:p.atk, def:p.def, gold:p.gold,
      inv:{...p.inv}, eq:{...p.eq},
      spellCds:{...p.spellCds}, atkBuff:{...p.atkBuff},
      x:world.currentFloor===0?p.x:world._surfacePx,
      y:world.currentFloor===0?p.y:world._surfacePy,
    },
    zones:[...world.spawnedZones],
    spx:world._surfacePx, spy:world._surfacePy,
    fog:_packFog(world.map.revealed),
  };
  try {
    localStorage.setItem(SAVE_KEY, JSON.stringify(data));
    sfx.save();
    world.log('Jogo salvo!','#44FF88');
  } catch(e) { world.log('Erro ao salvar!','#FF4444'); }
}

function loadGame() {
  const raw = localStorage.getItem(SAVE_KEY);
  if (!raw) return;
  let data;
  try { data = JSON.parse(raw); } catch(e) { return; }
  if (data.v !== 1) return;
  const pd = data.p;
  startGame(pd.name, pd.voc);
  const p = world.player;
  p.level=pd.level; p.xp=pd.xp;
  p.hp=pd.hp; p.maxHp=pd.maxHp; p.mp=pd.mp; p.maxMp=pd.maxMp;
  p.atk=pd.atk; p.def=pd.def; p.gold=pd.gold;
  p.inv=pd.inv; p.eq=pd.eq;
  p.spellCds=pd.spellCds||{}; p.atkBuff=pd.atkBuff||{val:1,ttl:0};
  p.x=pd.x; p.y=pd.y;
  p.px=pd.x*TILE+TILE/2; p.py=pd.y*TILE+TILE/2;
  // Ensure new eq slots exist in old saves
  for(const sl of EQ_SLOTS){if(!(sl in p.eq))p.eq[sl]=null;}
  world.spawnedZones=new Set(data.zones||[]);
  world._surfacePx=data.spx||pd.x; world._surfacePy=data.spy||pd.y;
  try { world.map.revealed=_unpackFog(data.fog); } catch(e){}
  if (renderer) { renderer._mmCanvas=null; renderer._fogCanvas=null; renderer._lastFloor=-1; }
  updateSpellBar(true);
  world.log('Jogo carregado!','#44FF88');
}

function _checkSaveOnSelect() {
  const raw = localStorage.getItem(SAVE_KEY);
  if (!raw) return;
  try {
    const d = JSON.parse(raw);
    const pd = d.p;
    const dt = new Date(d.ts);
    const fmt = `${dt.toLocaleDateString('pt-BR')} ${dt.toLocaleTimeString('pt-BR',{hour:'2-digit',minute:'2-digit'})}`;
    document.getElementById('saveInfo').style.display='block';
    document.getElementById('saveInfo').textContent=`${pd.name} · ${pd.voc} · Nível ${pd.level} · ${fmt}`;
    document.getElementById('continueBtn').style.display='block';
  } catch(e){}
}

function startGame(name, voc) {
  document.getElementById('charSelect').style.display = 'none';
  document.getElementById('gameWrap').style.display   = 'block';
  const canvas = document.getElementById('gameCanvas');
  renderer = new Renderer(canvas);
  const player = new Player(30, 30, name||'Herói', voc||'Knight');
  world = new World(player);
  setupLayout();
  // Re-init pixel position with final TILE value
  player.px = player.x * TILE + TILE/2;
  player.py = player.y * TILE + TILE/2;
  bindInput();
  running = true;
  loop();
}

function loop() {
  if (!running) return;
  world.update();
  // Smooth movement animation — lerp visual pos toward logical tile center
  const _p = world.player;
  const _tx = _p.x * TILE + TILE/2, _ty = _p.y * TILE + TILE/2;
  _p.px += (_tx - _p.px) * 0.42;
  _p.py += (_ty - _p.py) * 0.42;
  if (Math.abs(_p.px - _tx) < 0.8) _p.px = _tx;
  if (Math.abs(_p.py - _ty) < 0.8) _p.py = _ty;
  renderer.render(world);
  updateSpellBar();
  setTimeout(loop, 33);
}

function doMove(dir) {
  const p = world.player; if (!p.alive) return;
  const m = {up:[0,-1],down:[0,1],left:[-1,0],right:[1,0]};
  const [dx,dy] = m[dir]||[0,0];
  const nx = p.x+dx, ny = p.y+dy;
  if (world.map.passable(nx,ny)) {
    world._preMoveX=p.x; world._preMoveY=p.y;
    p.x=nx; p.y=ny;
    if(world.currentFloor===0){world._surfacePx=p.x;world._surfacePy=p.y;}
    sfx.step();
    world._checkTransition();
  }
}

function bindInput() {
  document.getElementById('dpad').querySelectorAll('[data-dir]').forEach(btn => {
    const dir = btn.dataset.dir;
    if (dir === 'attack') { btn.addEventListener('click', ()=>world.attackNearest()); return; }
    const start = () => {
      doMove(dir); heldDir=dir; btn.classList.add('active');
      clearInterval(heldInterval);
      heldInterval = setInterval(()=>doMove(heldDir), 180);
    };
    const stop = () => {
      if (heldDir===dir){heldDir=null;clearInterval(heldInterval);}
      btn.classList.remove('active');
    };
    btn.addEventListener('touchstart', e=>{e.preventDefault();start();},{passive:false});
    btn.addEventListener('touchend',   e=>{e.preventDefault();stop();}, {passive:false});
    btn.addEventListener('mousedown', start);
    btn.addEventListener('mouseup',   stop);
    btn.addEventListener('mouseleave',stop);
  });

  document.getElementById('btnHp').addEventListener('click', ()=>world.useHpPotion());
  document.getElementById('btnMp').addEventListener('click', ()=>world.useMpPotion());
  document.getElementById('btnInv').addEventListener('click', openInventory);
  document.getElementById('btnSave').addEventListener('click', saveGame);
  document.getElementById('btnMute').addEventListener('click', ()=>{
    const muted = sfx.toggleMute();
    document.getElementById('btnMute').innerHTML = `${muted?'🔇':'🔊'}<br>SOM`;
  });

  const keyMap = {ArrowUp:'up',ArrowDown:'down',ArrowLeft:'left',ArrowRight:'right',
                  w:'up',s:'down',a:'left',d:'right',W:'up',S:'down',A:'left',D:'right'};
  document.addEventListener('keydown', e => {
    if (!world||!running) return;
    if (keyMap[e.key]) { e.preventDefault(); doMove(keyMap[e.key]); }
    else if (e.key==='f'||e.key==='F') world.attackNearest();
    else if (e.key==='p'||e.key==='P') world.useHpPotion();
    else if (e.key==='m'||e.key==='M') world.useMpPotion();
    else if (e.key==='i'||e.key==='I') openInventory();
    else if ('12345'.includes(e.key)) world.castSpell(+e.key-1);
  });

  const canvas = document.getElementById('gameCanvas');
  const onTap = (cx, cy) => {
    if (!world) return;
    // Tap in UI panel — check spell buttons
    if (cx >= renderer.mapW) {
      const relX = cx - renderer.mapW;
      for (const btn of renderer.spellBtnRects) {
        if (relX >= btn.x && relX <= btn.x+btn.w && cy >= btn.y && cy <= btn.y+btn.h) {
          world.castSpell(btn.idx); return;
        }
      }
      return;
    }
    if (cy > renderer.mapH) return;
    const camX = world.player.px - renderer.mapW/2;
    const camY = world.player.py - renderer.mapH/2;
    const wx = Math.floor((cx+camX)/TILE);
    const wy = Math.floor((cy+camY)/TILE);
    const npc = world.npcs.find(n=>n.alive&&n.x===wx&&n.y===wy);
    if (npc) { world.interactNPC(npc); return; }
    const m = world.monsters.find(m=>m.alive&&m.x===wx&&m.y===wy);
    if (m) world.attackMonster(m);
  };
  canvas.addEventListener('click', e => { const r=canvas.getBoundingClientRect(); onTap(e.clientX-r.left,e.clientY-r.top); });
  canvas.addEventListener('touchend', e => {
    const t=e.changedTouches[0];
    const r=canvas.getBoundingClientRect();
    onTap(t.clientX-r.left, t.clientY-r.top);
  },{passive:true});

  window.addEventListener('resize', ()=>{ if(renderer) setupLayout(); });
}

// ─── INVENTORY ────────────────────────────────────────
function openInventory() {
  const p = world.player;
  document.getElementById('invTitle').textContent = `INVENTÁRIO — ${p.name} (Lv.${p.level})`;
  const slotLabel = {weapon:'Arma',armor:'Armadura',helmet:'Capacete',legs:'Calças',
                     boots:'Botas',shield:'Escudo',ring:'Anel',amulet:'Amuleto'};
  let html = `<div style="color:#FFD700;font-size:13px;margin-bottom:4px">Gold: ${p.gold} | ATK: ${p.totalAtk} | DEF: ${p.totalDef}</div>`;
  html += `<div class="inv-section-title">EQUIPADO</div>`;
  for (const sl of EQ_SLOTS) {
    const id = p.eq[sl];
    if (!id) continue;
    const it = ITEMS[id];
    const stat = it.atk&&it.def?`ATK+${it.atk} DEF+${it.def}`:it.atk?`ATK+${it.atk}`:`DEF+${it.def}`;
    html += `<div class="inv-item"><span class="inv-item-name" style="color:#88FF88">${slotLabel[sl]}: ${it.n} <span style="color:#666;font-size:11px">${stat}</span></span></div>`;
  }
  html += `<div class="inv-section-title">ITENS</div>`;
  for (const [idStr,cnt] of Object.entries(p.inv)) {
    const id = +idStr, it = ITEMS[id]; if (!it) continue;
    let extra='', action='';
    if (it.t==='potion'||it.t==='food') {
      extra = [it.hp?`HP+${it.hp}`:'', it.mp?`MP+${it.mp}`:''].filter(Boolean).join(' ');
      action = `<button class="inv-btn" onclick="useItem(${id})">USAR</button>`;
    } else if (EQ_SLOTS.includes(it.t)) {
      extra = [it.atk?`ATK+${it.atk}`:'', it.def?`DEF+${it.def}`:''].filter(Boolean).join(' ');
      action = `<button class="inv-btn" onclick="equipItem(${id})">EQUIPAR</button>`;
    } else if (it.t==='loot') {
      extra = `${it.val}g cada`;
    }
    html += `<div class="inv-item"><span class="inv-item-name">${it.n} x${cnt} <span style="color:#888;font-size:11px">${extra}</span></span>${action}</div>`;
  }
  document.getElementById('invContent').innerHTML = html;
  document.getElementById('invModal').classList.add('show');
}
window.useItem   = id => { world.player.useConsumable(id); openInventory(); };
window.equipItem = id => { world.player.equip(id); sfx.equip(); world.log(`Equipou ${ITEMS[id].n}!`,'#88FF88'); openInventory(); };
document.getElementById('invClose').addEventListener('click', ()=>document.getElementById('invModal').classList.remove('show'));

// ─── CHARACTER SELECT ─────────────────────────────────
const vocList = Object.keys(VOCATIONS);
let selVoc = 0;
const grid = document.getElementById('vocGrid');
vocList.forEach((v, i) => {
  const btn = document.createElement('div');
  btn.className = 'voc-btn' + (i===0?' sel':'');
  btn.innerHTML = `<div class="vname" style="color:${VOCATIONS[v].color}">${v}</div><div class="vdesc">${VOCATIONS[v].desc}</div>`;
  btn.onclick = () => {
    selVoc = i;
    grid.querySelectorAll('.voc-btn').forEach((b,j)=>b.classList.toggle('sel',j===i));
  };
  grid.appendChild(btn);
});
// ─── SHOP ─────────────────────────────────────────────
let _shopNpc = null, _shopTab = 'buy';

function openShop(npc) {
  _shopNpc = npc;
  document.getElementById('shopTitle').textContent = `${npc.title} — ${npc.name}`;
  document.getElementById('shopModal').classList.add('show');
  shopTab('buy');
}
function closeShop() {
  document.getElementById('shopModal').classList.remove('show');
  _shopNpc = null;
}
function shopTab(tab) {
  _shopTab = tab;
  document.getElementById('tabBuy').classList.toggle('active', tab==='buy');
  document.getElementById('tabSell').classList.toggle('active', tab==='sell');
  const p = world.player;
  document.getElementById('shopGold').textContent = `Seu ouro: ${p.gold}g`;
  let html = '';
  if (tab === 'buy') {
    for (const id of (_shopNpc.stock||[])) {
      const it = ITEMS[id]; if (!it) continue;
      const price = Math.ceil(it.val * 1.3);
      const can = p.gold >= price;
      const stat = it.hp?`HP+${it.hp}`:it.mp?`MP+${it.mp}`:it.atk?`ATK+${it.atk}`:`DEF+${it.def}`;
      html += `<div class="shop-item">
        <span class="shop-item-name" style="color:${can?'#EEE':'#666'}">${it.n}
          <span style="color:#888;font-size:11px">${stat} · Lv${it.lvl}</span></span>
        <span style="color:#FFD700;min-width:44px;text-align:right">${price}g</span>
        <button class="inv-btn" onclick="buyItem(${id},${price})" ${can?'':'disabled style="opacity:.35"'}>COMPRAR</button>
      </div>`;
    }
    if (!(_shopNpc.stock||[]).length) html='<div style="color:#666;padding:16px;text-align:center">Sem estoque.</div>';
  } else {
    const sellable = Object.entries(p.inv).filter(([id])=>{const it=ITEMS[id];return it&&it.t!=='gold';});
    for (const [idStr,cnt] of sellable) {
      const id=+idStr,it=ITEMS[id];
      const price = Math.floor(it.val * 0.5);
      const stat = it.hp?`HP+${it.hp}`:it.mp?`MP+${it.mp}`:it.atk?`ATK+${it.atk}`:`DEF+${it.def}`;
      html += `<div class="shop-item">
        <span class="shop-item-name">${it.n} <span style="color:#888;font-size:11px">x${cnt} · ${stat}</span></span>
        <span style="color:#88FF88;min-width:44px;text-align:right">${price}g</span>
        <button class="inv-btn" onclick="sellItem(${id},${price})">VENDER</button>
      </div>`;
    }
    if (!sellable.length) html='<div style="color:#666;padding:16px;text-align:center">Sem itens para vender.</div>';
  }
  document.getElementById('shopContent').innerHTML = html;
}
function buyItem(id, price) {
  const p = world.player;
  if (p.gold < price) { world.log('Ouro insuficiente!','#FF4444'); return; }
  p.gold -= price; p.addItem(id);
  sfx.shop();
  world.log(`Você comprou ${ITEMS[id].n} por ${price}g.`,'#FFD700');
  shopTab(_shopTab);
}
function sellItem(id, price) {
  const p = world.player;
  if (!p.inv[id]) return;
  p.inv[id]--; if (!p.inv[id]) delete p.inv[id];
  p.gold += price;
  sfx.shop();
  world.log(`Você vendeu ${ITEMS[id].n} por ${price}g.`,'#88FF88');
  shopTab(_shopTab);
}

document.getElementById('startBtn').addEventListener('click', () => {
  const name = document.getElementById('nameInput').value.trim()||'Herói';
  startGame(name, vocList[selVoc]);
});
document.getElementById('nameInput').addEventListener('keydown', e=>{
  if (e.key==='Enter') document.getElementById('startBtn').click();
});
_checkSaveOnSelect();
</script>
</body>
